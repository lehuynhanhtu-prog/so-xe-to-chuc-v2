<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Sổ Xe Tổ Chức v2</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17324d;background:#f3f7f8}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh}.shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 10%,#d9f3ed 0,transparent 38%),radial-gradient(circle at 90% 90%,#dcecff 0,transparent 42%)}.card{width:min(520px,100%);padding:34px;border:1px solid #d9e6e8;border-radius:22px;background:#ffffffed;box-shadow:0 24px 80px #17324d18;text-align:center}.logo{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 18px;border-radius:16px;background:#0f766e;color:#fff;font-size:28px;box-shadow:0 10px 28px #0f766e3d}h1{font-size:26px;margin:0}p{line-height:1.65;color:#577085}.open{display:inline-block;margin-top:12px;padding:14px 22px;border-radius:11px;background:#0f766e;color:#fff;font-weight:750;text-decoration:none}.note{margin-top:20px;padding:12px 14px;border-radius:10px;background:#eef7f6;color:#526c7e;font-size:14px}.error{color:#ae2d27;background:#fff0ef;padding:12px 14px;border-radius:10px;margin-top:18px}@media(max-width:560px){.shell{padding:14px}.card{padding:28px 20px}}
  </style>
</head>
<body data-build="0faa4ecfaa88">
  <main class="shell">
    <section class="card">
      <div class="logo">▤</div>
      <h1>Sổ Xe Tổ Chức V2</h1>
      <p id="status">Nhấn nút bên dưới để mở ứng dụng an toàn.</p>
      <a id="open" class="open" href="#">Mở Sổ Xe Tổ Chức</a>
      <div class="note">Nếu đang mở link trong Zalo, Facebook hoặc ứng dụng nhắn tin, hãy chọn mở bằng Chrome.</div>
      <div id="error" class="error" hidden></div>
    </section>
  </main>
  <script src="sheets-config.js?v=d22ff5daba33"></script>
  <script>
    'use strict';
    const open=document.querySelector('#open'),status=document.querySelector('#status'),error=document.querySelector('#error');
    const valid=url=>/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:[?#].*)?$/.test(url);
    const query=new URLSearchParams(location.search).get('service'),configured=window.SO_XE_SHEETS_CONFIG?.serviceUrl,target=String(query||configured||'').trim();
    if(valid(target)){
      open.href=target;
    }else{
      status.textContent='Chưa thể mở ứng dụng.';
      open.hidden=true;
      error.textContent='Địa chỉ dịch vụ chưa được cấu hình đúng. Vui lòng liên hệ Admin.';
      error.hidden=false;
    }
  </script>
</body>
</html>
