<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sổ Xe Tổ Chức</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#142b43;background:#f4f7fb;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:#176a65;color:white;font-weight:600}button.secondary{background:#e8f0f5;color:#24435c}button.danger{background:#fff0ef;color:#a52c26}button:disabled{opacity:.5;cursor:wait}a{color:#176a65}input,select,textarea{width:100%;border:1px solid #cedae4;border-radius:9px;padding:11px;background:white;color:inherit}label{display:block;margin:14px 0 6px;font-weight:600}small,.muted{color:#60758a}h1{font-size:27px;line-height:1.2;margin:10px 0}h2{font-size:21px;margin:0 0 18px}h3{font-size:17px}.shell{max-width:1150px;margin:auto;padding:24px}.gate{max-width:490px;margin:5vh auto;padding:32px;background:white;border:1px solid #dfE7ef;border-radius:18px;box-shadow:0 12px 45px #1632470c}.brand{display:flex;align-items:center;gap:13px;margin-bottom:23px}.logo{width:43px;height:43px;display:grid;place-items:center;border-radius:12px;background:#176a65;color:white;font-size:23px}.brand strong{font-size:19px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{border:1px solid #dfe7ef;background:white;border-radius:14px;padding:22px;margin-bottom:18px}.stat{font-size:28px;font-weight:700;margin-top:7px}nav{display:flex;gap:8px;margin:22px 0;flex-wrap:wrap}nav button{background:transparent;color:#60758a}nav button.active{color:#176a65;background:#e0f0eb}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:14px 10px;border-bottom:1px solid #e9eef3;vertical-align:top}th{font-size:13px;color:#60758a}td button{padding:7px 10px;font-size:13px}.empty{padding:30px;text-align:center;color:#60758a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.error{padding:12px;background:#fff0ef;color:#a52c26;border-radius:9px;margin:14px 0}.notice{padding:12px;background:#eef7f6;border-radius:9px;font-size:14px;margin:15px 0;line-height:1.6}.steps{font-size:13px;color:#176a65;margin:10px 0 22px}.wide{width:100%;margin-top:20px}dialog{border:0;border-radius:17px;padding:26px;max-width:600px;width:calc(100% - 30px);max-height:90vh;overflow:auto;color:inherit;box-shadow:0 20px 100px #1235}dialog::backdrop{background:#102b4390}textarea{min-height:80px}#status{font-size:13px;color:#60758a;min-height:20px}.file-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;gap:8px}.file-row span{overflow-wrap:anywhere}footer{text-align:center;color:#60758a;font-size:12px;padding:24px}[hidden]{display:none!important}@media(max-width:600px){.shell{padding:16px}.gate{padding:24px;margin:20px auto}.card{padding:16px}h1{font-size:23px}td,th{padding:11px 7px}header>.row{display:grid;grid-template-columns:repeat(3,1fr);width:100%}header>.row button{padding:10px 8px;font-size:13px}.transactions-table thead{display:none}.transactions-table tr{display:block;border-bottom:1px solid #e9eef3;padding:14px 0}.transactions-table tr:last-child{border-bottom:0}.transactions-table td{display:block;border:0;padding:5px 0}.transactions-table td:first-child{font-size:16px}.transactions-table td:nth-child(3){font-size:18px;font-weight:700;color:#176a65}.transactions-table td:nth-child(4)::before{content:'Người nhập: ';color:#60758a}.transactions-table td:last-child{padding-top:10px}}
</style></head><body>
<div class="shell">
<section id="gate" class="gate"><div class="brand"><div class="logo">▤</div><div><strong>Sổ Xe Tổ Chức</strong><br><small>Quản lý xe và chi phí dùng chung</small></div></div><div id="gateContent"></div><div id="gateError" class="error" hidden role="alert"></div></section>
<main id="app" hidden><header class="row spread"><div><small id="identity"></small><h1 id="orgName"></h1></div><div class="row"><button class="secondary" id="reload">Đồng bộ</button><button class="secondary" id="googleReconnect">Kết nối Google</button><button class="secondary" id="passwordButton">Đổi mật khẩu</button><button class="secondary" id="logout">Đăng xuất</button></div></header><div id="status" role="status"></div><nav id="nav"></nav><section id="content"></section></main>
<footer>Phiên bản 3.1 (bản cũ) · Drive API trực tiếp · <a href="setup.html">Hướng dẫn</a></footer></div>
<dialog id="modal"><form id="modalForm"><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalError" class="error" hidden role="alert"></div><div class="actions"><button id="modalSubmit" type="submit">Lưu</button><button class="secondary" type="button" id="closeModal">Đóng</button></div></form></dialog><script src="google-config.js?v=5d69aba05176"></script><script type="module">
import {GoogleConnection} from './google.mjs?v=77687561dd39';
import {Service} from './service.mjs?v=551b02e6e0ac';
let connection,service,poll,operationId, state=null,tab='overview',modalHandler=null,files=[],mailInvites=[];
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('vi-VN')+' ₫',roles={admin:'Admin',viewer:'Admin · chỉ xem',driver:'Người quản lý/lái xe'},categories={fuel:'Nhiên liệu',maintenance:'Bảo dưỡng',insurance:'Bảo hiểm',inspection:'Đăng kiểm',road_fee:'Phí đường bộ',other:'Chi phí khác'};
const admin=()=>state?.me.role==='admin',write=()=>state?.me.role!=='viewer',name=id=>state.users.find(u=>u.id===id)?.name||'—',plate=id=>state.carChoices.find(c=>c.id===id)?.plate||'—',today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function errorAt(s,e){const b=$(s);b.textContent=e.message||String(e);b.hidden=false;}
async function busy(b,fn,s='#gateError'){b.disabled=true;try{await fn();}catch(e){errorAt(s,e);}finally{b.disabled=false;}}
function gate(html){$('#app').hidden=true;$('#gate').hidden=false;$('#gateContent').innerHTML=html;$('#gateError').hidden=true;}
async function returnFromConfig(){if(service&&connection?.identity){if(service.account&&state){$('#gate').hidden=true;$('#gateContent').innerHTML='';$('#app').hidden=false;render();}else await profilesGate();}else{connection?.disconnect();connection=null;start();}}
function configGate(){const c=connection?.config||readConfig();gate('<h2>Cấu hình Google dùng chung</h2><p>Client ID của Sổ Xe cá nhân đã điền sẵn. Chỉ cần bổ sung API key của Google Picker trong cùng dự án.</p><form id="config"><label>OAuth Client ID</label><input name="clientId" required value="'+esc(c.clientId)+'"><label>Project number</label><input name="projectNumber" required value="'+esc(c.projectNumber)+'"><label>Picker API key</label><input name="apiKey" type="password" autocomplete="off" value="'+esc(c.apiKey)+'"><button class="wide">Lưu cấu hình</button><button id="cancelConfig" type="button" class="secondary wide">Quay lại</button></form>');$('#cancelConfig').onclick=e=>busy(e.target,returnFromConfig);$('#config').onsubmit=e=>{e.preventDefault();const c=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,String(v).trim()]));busy(e.submitter,async()=>{if(!/^[\w.-]+\.apps\.googleusercontent\.com$/.test(c.clientId)||!/^\d+$/.test(c.projectNumber))throw new Error('Client ID hoặc Project number không hợp lệ.');if(service&&(c.clientId!==connection.config.clientId||c.projectNumber!==connection.config.projectNumber))throw new Error('Đăng xuất Google trước khi thay Client ID hoặc Project number.');try{localStorage.setItem('soxe-google-config-v3',JSON.stringify(c));}catch{throw new Error('Trình duyệt không cho lưu cấu hình. Cho phép lưu dữ liệu trang web rồi thử lại.');}if(connection)Object.assign(connection.config,c);await returnFromConfig();});};}
function readConfig(){try{return {...window.SO_XE_GOOGLE_CONFIG,...JSON.parse(localStorage.getItem('soxe-google-config-v3')||'{}')};}catch{return window.SO_XE_GOOGLE_CONFIG;}}
function start(){gate('<h2>Quản lý xe của tổ chức</h2><p>Đăng nhập Google để mở tài khoản trên Drive của bạn. Dữ liệu được mã hóa trước khi lưu.</p><button id="googleLogin" class="wide">Đăng nhập bằng Google</button><button id="emailLogin" class="secondary wide">NSD: nhận lời mời qua email</button><button id="configure" class="secondary wide">Cấu hình Google</button>');$('#emailLogin').onclick=e=>busy(e.target,async()=>{connection=new GoogleConnection(readConfig());await connection.initialize('read');const r=await connection.connect();service=new Service(r.drive,r.identity,connection.config);mailInvites=await connection.gmail.readInvitations();if((await service.drive.profiles()).length)await profilesGate();else joinGate();});$('#configure').onclick=configGate;$('#googleLogin').onclick=e=>busy(e.target,async()=>{connection=new GoogleConnection(readConfig());await connection.initialize();const r=await connection.connect();service=new Service(r.drive,r.identity,connection.config);await profilesGate();});}
async function profilesGate(){const profiles=(await service.drive.profiles()).filter(f=>!String(f.appProperties?.model||'').startsWith('two-google-'));gate('<h2>Tài khoản của bạn</h2><p>'+esc(service.identity.email)+'</p>'+(profiles.length?'<form id="open"><label>Tài khoản trên Drive</label><select name="profile">'+profiles.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')+'</select><label>Mật khẩu mã hóa</label><input name="password" type="password" required><button class="wide">Mở tài khoản</button></form>':'<p>Chưa có tài khoản. Tạo tổ chức hoặc nhận lời mời Admin gửi.</p>')+'<div class="actions"><button id="createOrg">Tạo tổ chức mới</button><button id="joinOrg" class="secondary">Nhập lời mời</button><button id="configAgain" class="secondary">Cấu hình Picker</button><button id="switchGoogle" class="secondary">Đăng xuất Google</button></div>');$('#open')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);busy(e.submitter,async()=>accept(await service.login(f.get('profile'),f.get('password'))));});$('#createOrg').onclick=createGate;$('#joinOrg').onclick=joinGate;$('#configAgain').onclick=configGate;$('#switchGoogle').onclick=logout;}
function passwordFields(){return '<label>Mật khẩu riêng (ít nhất 6 ký tự)</label><input name="password" type="password" minlength="6" maxlength="128" required autocomplete="new-password"><label>Nhập lại mật khẩu</label><input name="confirm" type="password" required autocomplete="new-password">';}
function verify(f){if(f.get('password')!==f.get('confirm'))throw new Error('Mật khẩu nhập lại không khớp.');}
function createGate(){gate('<h2>Tạo tổ chức</h2><form id="create"><label>Tên tổ chức</label><input name="organizationName" required maxlength="120"><label>Tên Admin</label><input name="adminName" required maxlength="80">'+passwordFields()+'<button class="wide">Tạo trên Drive của tôi</button></form>');$('#create').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);busy(e.submitter,async()=>{verify(f);accept(await service.createOrganization(Object.fromEntries(f)));});};}
function joinGate(){gate('<h2>Nhận lời mời qua email</h2><p>Dùng đúng Google được Admin mời. App đọc lời mời mã hóa từ Gmail; sau đó chọn file được chia sẻ trong Picker.</p><button id="readMail" class="secondary">Đọc lời mời từ Gmail</button><form id="join"><label>Lời mời đã nhận</label><select name="mail"><option value="">Chọn lời mời</option>'+mailInvites.map((m,i)=>'<option value="'+i+'">'+esc(m.from)+' · '+esc(m.subject)+'</option>').join('')+'</select><details><summary>Nhập file dự phòng</summary><input name="file" type="file" accept=".json"></details><label>Mật khẩu mở lời mời (Admin gửi riêng)</label><input name="code" type="password" required>'+passwordFields()+'<button class="wide">Khởi tạo tài khoản</button></form>');$('#readMail').onclick=e=>busy(e.target,async()=>{const gmail=await connection.ensureGmail('read');mailInvites=await gmail.readInvitations();joinGate();if(!mailInvites.length)$('#gateError').textContent='Chưa tìm thấy email lời mời. Kiểm tra đúng tài khoản Google và nhờ Admin gửi lại.';$('#gateError').hidden=!!mailInvites.length;});$('#join').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);busy(e.submitter,async()=>{verify(f);let invitation=mailInvites[Number(f.get('mail'))]?.invitation;if(f.get('mail')==='')invitation=null;if(!invitation){const file=f.get('file');if(!file?.size)throw new Error('Chọn lời mời từ Gmail trước.');if(file.size>100000)throw new Error('File lời mời quá lớn.');invitation=JSON.parse(await file.text());}accept(await service.join(invitation,f.get('code'),f.get('password'),(id,c)=>connection.pick(id,c)));});};}
async function sendInvite(email,invitation){try{await connection.gmail.sendInvitation(email,invitation,state.organization.id);$('#status').textContent='Đã gửi email lời mời. Gửi mật khẩu mở lời mời cho NSD qua kênh riêng.';}catch(e){download(JSON.stringify(invitation),'so-xe-loi-moi.enc.json','application/json');throw new Error('Tài khoản/lời mời đã tạo nhưng Gmail chưa xác nhận gửi. Đã tải file dự phòng. Có thể bấm Lời mời để gửi lại. '+e.message);}}

function accept(r){if(r.deletionPending){gate('<h2>Hoàn tất xóa tổ chức</h2><button id="finishDelete">Tiếp tục xóa</button>');$('#finishDelete').onclick=()=>deleteOrg(r.organizationName);return;}state=r.data;$('#gateContent').innerHTML='';$('#gate').hidden=true;$('#app').hidden=false;render();status(r);clearInterval(poll);poll=setInterval(()=>{if(!document.hidden&&!$('#modal').open){if(Date.now()>=connection.drive.expires){$('#status').textContent='Phiên Google hết hạn. Bấm Kết nối Google.';return;}run(()=>call('read'));}},60000);}
function status(r){$('#status').textContent=(state?.pending?'Đã lưu Drive của bạn · '+state.pending+' thao tác chờ Admin đồng bộ':'Đã đồng bộ · '+new Date().toLocaleTimeString('vi-VN'))+(r.warnings?.length?' · '+r.warnings.join(' · '):'')+(state?.conflicts?.length?' · '+state.conflicts.length+' thao tác bị từ chối; xem Tổng quan':'');}
async function call(action,args={}){const s=service;if(!['read','attachment','export','inviteUser','changePassword','deleteOrganization'].includes(action))args.operationId=($('#modal').open?operationId:null)||crypto.randomUUID();const r=await s.api(action,args);if(s!==service)return {};if(r.data){state=r.data;render();}status(r);return r;}
function logout(){clearInterval(poll);connection?.disconnect();service=null;state=null;files=[];mailInvites=[];$('#modal').close();$('#modalBody').innerHTML='';$('#content').innerHTML='';tab='overview';start();}
function render(){if(!state||state.me.mustChange)return;$('#orgName').textContent=state.organization.name;$('#identity').textContent=state.me.name+' · '+roles[state.me.role];const tabs=[['overview','Tổng quan'],['cars','Xe'],['transactions','Giao dịch']];if(admin())tabs.push(['members','Người sử dụng'],['settings','Tổ chức']);if(!tabs.some(x=>x[0]===tab))tab='overview';$('#nav').innerHTML=tabs.map(([id,label])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'">'+label+'</button>').join('');({overview:renderOverview,cars:renderCars,transactions:renderTransactions,members:renderMembers,settings:renderSettings}[tab])();}
function renderOverview(){const total=state.transactions.reduce((s,t)=>s+t.amount,0);$('#content').innerHTML=(state.me.role!=='admin'?'<div class="notice">Link nhật ký để gửi Admin: <a target="_blank" rel="noopener" href="https://drive.google.com/file/d/'+encodeURIComponent(state.journalId)+'/view">Mở nhật ký trên Drive</a></div>':'')+(state.conflicts?.length?'<div class="error">'+state.conflicts.map(c=>esc(c.message)).join('<br>')+'</div>':'')+'<div class="grid"><div class="card"><small>Xe trong phạm vi quản lý</small><div class="stat">'+state.cars.length+'</div></div><div class="card"><small>Giao dịch được xem</small><div class="stat">'+state.transactions.length+'</div></div><div class="card"><small>Tổng chi phí được xem</small><div class="stat">'+money(total)+'</div></div></div><div class="card"><h2>Chi phí theo loại</h2>'+Object.entries(categories).map(([k,v])=>'<div class="row spread" style="padding:12px 0;border-bottom:1px solid #eef2f5"><span>'+v+'</span><strong>'+money(state.transactions.filter(t=>t.category===k).reduce((s,t)=>s+t.amount,0))+'</strong></div>').join('')+'</div><div class="card"><h2>Giao dịch gần đây</h2>'+transactionTable(state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))+'</div>';}
function renderCars(){const cards=state.cars.map(c=>{const a=state.assignments.find(x=>x.carId===c.id&&!x.endedAt),total=state.transactions.filter(t=>t.carId===c.id).reduce((s,t)=>s+t.amount,0);return '<article class="card"><h2>'+esc(c.plate)+'</h2><p>'+esc(c.name)+'</p><p class="muted">'+Number(c.odo).toLocaleString('vi-VN')+' km · '+esc(a?name(a.userId):'Chưa phân công')+'</p><strong>'+money(total)+'</strong>'+fileList(c.attachments,'car',c.id)+(admin()?'<div class="actions"><button data-edit-car="'+c.id+'">Sửa</button><button class="secondary" data-assign-car="'+c.id+'">Phân công</button><button class="danger" data-delete-car="'+c.id+'">Xóa</button></div>':'')+'</article>';}).join('');$('#content').innerHTML='<div class="row spread" style="margin-bottom:18px"><h2>Xe</h2>'+(admin()?'<button id="addCar">Thêm xe</button>':'')+'</div><div class="grid">'+(cards||'<div class="empty">Chưa có xe trong phạm vi quản lý.</div>')+'</div>';$('#addCar')?.addEventListener('click',()=>editCar());}
function transactionTable(list){return list.length?'<div class="table-wrap"><table class="transactions-table"><thead><tr><th>Ngày / xe</th><th>Nội dung</th><th>Chi phí</th><th>Người nhập</th><th>Thao tác</th></tr></thead><tbody>'+list.map(t=>'<tr><td>'+esc(t.date)+'<br><strong>'+esc(plate(t.carId))+'</strong></td><td>'+esc(categories[t.category])+'<br><small>'+esc(t.note)+'</small>'+fileList(t.attachments,'transaction',t.id)+'</td><td>'+money(t.amount)+'</td><td>'+esc(name(t.enteredBy))+(t.enteredBy!==t.enteredFor?'<br><small>Nhập hộ: '+esc(name(t.enteredFor))+'</small>':'')+'</td><td>'+(admin()||write()&&t.enteredBy===state.me.id?'<div class="row"><button class="secondary" data-edit-transaction="'+t.id+'">Sửa</button><button class="danger" data-delete-transaction="'+t.id+'">Xóa</button></div>':'Chỉ xem')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Chưa có giao dịch.</div>';}
function renderTransactions(){const list=state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));$('#content').innerHTML='<div class="row spread" style="margin-bottom:18px"><h2>Giao dịch</h2>'+(write()?'<button id="addTransaction">Nhập giao dịch</button>':'')+'</div><div class="card">'+transactionTable(list)+'</div>';$('#addTransaction')?.addEventListener('click',()=>editTransaction());}
function renderMembers(){$('#content').innerHTML='<div class="row spread"><h2>Người sử dụng</h2><button id="addUser">Tạo tài khoản</button></div><div class="card table-wrap"><table><thead><tr><th>Người sử dụng</th><th>Vai trò</th><th>Thao tác</th></tr></thead><tbody>'+state.users.map(u=>'<tr><td>'+esc(u.name)+'<br><small>'+esc(u.email)+'</small><br>'+esc(u.username)+'</td><td>'+roles[u.role]+'<br>'+(u.active?'Đã khởi tạo':'Chờ khởi tạo')+'</td><td>'+(u.id===state.me.id?'Đang đăng nhập':'<button data-invite="'+u.id+'">Lời mời</button> <button data-delete-user="'+u.id+'" class="danger">Xóa</button>')+(u.role!=='admin'?'<button data-journal="'+u.id+'" class="secondary">Kết nối nhật ký</button><button data-view="'+u.id+'" class="secondary">Kết nối file được xem</button>':'')+'</td></tr>').join('')+'</tbody></table></div><div class="notice">Sau khi NSD khởi tạo, họ gửi link nhật ký cho Admin. Admin chọn file này một lần qua Picker để nhận giao dịch. Admin bổ sung cũng cần chọn các file được xem qua Picker.</div>';$('#addUser').onclick=createUser;}
function renderSettings(){$('#content').innerHTML='<div class="card"><h2>Tổ chức</h2><label>Tên tổ chức</label><input id="rename" value="'+esc(state.organization.name)+'"><button id="renameButton">Lưu tên</button><p>Google sở hữu: '+esc(state.organization.ownerEmail)+'</p><a href="https://drive.google.com/file/d/'+encodeURIComponent(state.rootId)+'/view" target="_blank" rel="noopener">File tổ chức mã hóa</a></div><div class="card"><h2>Kết nối Google</h2><button id="reconnect">Cấp lại phiên Google</button> <button id="pickerConfig">Cấu hình Picker</button></div><div class="card"><h2>Sao lưu</h2><button id="exportButton">Tải bản sao mã hóa</button></div><div class="card"><h2>Xóa tổ chức</h2><p>Khóa quyền truy cập, chuyển file do Admin sở hữu vào thùng rác. Nhật ký và tài khoản riêng thuộc Drive NSD không thể xóa thay họ.</p><button id="deleteOrg" class="danger">Xóa tổ chức</button></div>';$('#renameButton').onclick=()=>run(()=>call('renameOrganization',{name:$('#rename').value}));$('#reconnect').onclick=()=>run(()=>connection.connect());$('#pickerConfig').onclick=configGate;$('#exportButton').onclick=()=>openModal('Sao lưu mã hóa','<label>Mật khẩu bảo vệ bản sao</label><input name="password" type="password" minlength="6" required>',async f=>{const r=await call('export',{password:f.get('password')});download(r.backup,'so-xe-backup.enc.json','application/json');});$('#deleteOrg').onclick=()=>deleteOrg(state.organization.name);}
function deleteOrg(n){openModal('Xóa tổ chức','<p>Nhập đúng tên '+esc(n)+' và mật khẩu riêng để xác nhận.</p><label>Tên tổ chức</label><input name="confirmation" required><label>Mật khẩu</label><input name="password" type="password" required>',async f=>{const r=await call('deleteOrganization',Object.fromEntries(f));if(r.deleted)logout();});}
function options(list,selected){return list.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===selected?'selected':'')+'>'+esc(x.label)+'</option>').join('');}
function fileList(list,kind,id){return (list||[]).map(f=>'<div class="file-row"><small>'+esc(f.name)+'</small><button class="secondary" data-file="'+esc(f.id)+'" data-kind="'+kind+'" data-record="'+id+'">Tải</button></div>').join('');}
function openModal(title,html,handler,existingFiles=[]){operationId=crypto.randomUUID();$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalError').hidden=true;modalHandler=handler;files=existingFiles.map(f=>({...f}));$('#modalSubmit').textContent=title.startsWith('Xóa')?'Xác nhận xóa':'Lưu';$('#modal').showModal();if($('#fileInput')){$('#fileInput').onchange=async e=>{try{const additions=[];for(const f of e.target.files){if(f.size>2*1024*1024)throw new Error('Mỗi tệp tối đa 2 MB.');const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f);});additions.push({name:f.name,type:f.type,base64});}if(files.length+additions.length>5)throw new Error('Tối đa 5 tệp.');files.push(...additions);renderEditFiles();}catch(err){errorAt('#modalError',err);}finally{e.target.value='';}};renderEditFiles();}}
function renderEditFiles(){$('#editFiles').innerHTML=files.map((f,i)=>'<div class="file-row"><span>'+esc(f.name)+'</span><button class="danger" type="button" data-remove-file="'+i+'">Xóa</button></div>').join('');$('#editFiles').onclick=e=>{const b=e.target.closest('[data-remove-file]');if(b){files.splice(Number(b.dataset.removeFile),1);renderEditFiles();}};}
const fileEditor='<label>Tệp đính kèm</label><input id="fileInput" type="file" multiple><small>Tối đa 5 tệp, mỗi tệp 2 MB. Tệp được mã hóa cùng dữ liệu.</small><div id="editFiles"></div>';
function editCar(id){const c=state.cars.find(x=>x.id===id)||{};openModal(id?'Sửa xe':'Thêm xe','<label>Biển số</label><input name="plate" required maxlength="30" value="'+esc(c.plate)+'"><label>Tên xe</label><input name="name" required maxlength="100" value="'+esc(c.name)+'"><label>Số km</label><input name="odo" type="number" min="0" max="10000000" value="'+(c.odo||0)+'">'+fileEditor,async f=>call('saveCar',{id:c.id,version:c.version,plate:f.get('plate'),name:f.get('name'),odo:Number(f.get('odo')),attachments:files}),c.attachments||[]);}
function editTransaction(id){const t=state.transactions.find(x=>x.id===id)||{};if(!state.carChoices.length)return alert('Admin cần nhập xe trước.');openModal(id?'Sửa giao dịch':'Nhập giao dịch','<label>Xe</label><select name="carId">'+options(state.carChoices.map(c=>({id:c.id,label:c.plate+' · '+c.name})),t.carId)+'</select><div class="grid"><div><label>Ngày</label><input name="date" type="date" required value="'+(t.date||today())+'"></div><div><label>Loại chi phí</label><select name="category">'+options(Object.entries(categories).map(([id,label])=>({id,label})),t.category)+'</select></div></div><label>Số tiền (đồng)</label><input name="amount" type="number" min="0" max="1000000000000" required value="'+(t.amount||0)+'"><label>Số km</label><input name="odo" type="number" min="0" max="10000000" value="'+(t.odo||0)+'"><label>Nhập cho người quản lý/lái xe</label><select name="enteredFor"><option value="">Người đang được phân công xe</option>'+options(state.users.filter(u=>u.role==='driver').map(u=>({id:u.id,label:u.name})),t.enteredFor)+'</select><label>Ghi chú</label><textarea name="note" maxlength="2000">'+esc(t.note)+'</textarea>'+fileEditor,async f=>call('saveTransaction',{id:t.id,version:t.version,carId:f.get('carId'),date:f.get('date'),category:f.get('category'),amount:Number(f.get('amount')),odo:Number(f.get('odo')),enteredFor:f.get('enteredFor'),note:f.get('note'),attachments:files}),t.attachments||[]);}
function assignCar(id){const drivers=state.users.filter(u=>u.role==='driver');if(!drivers.length)return alert('Hãy tạo tài khoản lái xe trước.');openModal('Phân công '+plate(id),'<label>Người quản lý/lái xe</label><select name="userId">'+'<option value="">Chưa phân công / Bỏ phân công</option>'+options(drivers.map(u=>({id:u.id,label:u.name})),state.assignments.find(a=>a.carId===id&&!a.endedAt)?.userId)+'</select>',async f=>call('assign',{carId:id,userId:f.get('userId')}));}
function download(content,filename,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
async function run(fn){$('#status').textContent='Đang xử lý…';try{await fn();}catch(e){$('#status').textContent=e.message;alert(e.message);}}
function createUser(){openModal('Tạo tài khoản','<label>Họ tên</label><input name="name" required><label>Tên định danh</label><input name="username" required pattern="[a-zA-Z0-9_.-]{3,40}"><label>Email Google của NSD</label><input name="email" type="email" value="@gmail.com" required><label>Vai trò</label><select name="role"><option value="driver">Người quản lý/lái xe</option><option value="viewer">Admin chỉ xem</option><option value="admin">Admin</option></select><label>Mật khẩu mở lời mời (gửi riêng)</label><input name="invitePassword" type="password" minlength="6" required>',async f=>{await connection.ensureGmail('send');const r=await call('createUser',Object.fromEntries(f));await sendInvite(String(f.get('email')).trim(),r.invitation);});}
$('#modalForm').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await modalHandler(new FormData(e.target));$('#modal').close();},'#modalError');};$('#closeModal').onclick=()=>$('#modal').close();
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();}};
$('#reload').onclick=()=>run(()=>call('read'));$('#googleReconnect').onclick=()=>run(()=>connection.connect());
$('#logout').onclick=logout;
$('#passwordButton').onclick=()=>openModal('Đổi mật khẩu','<label>Mật khẩu hiện tại</label><input name="current" type="password" required autocomplete="off"><label>Mật khẩu mới</label><input name="new" type="password" minlength="6" maxlength="128" required autocomplete="new-password"><label>Nhập lại mật khẩu mới</label><input name="confirm" type="password" required autocomplete="new-password">',async f=>{if(f.get('new')!==f.get('confirm'))throw new Error('Mật khẩu nhập lại không khớp.');await call('changePassword',{currentPassword:f.get('current'),password:f.get('new')});});
$('#content').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.editCar)editCar(d.editCar);if(d.assignCar)assignCar(d.assignCar);if(d.editTransaction)editTransaction(d.editTransaction);if(d.deleteTransaction){const t=state.transactions.find(x=>x.id===d.deleteTransaction);if(confirm('Xóa giao dịch và tất cả tệp đính kèm của giao dịch?'))run(()=>call('deleteTransaction',{id:t.id,version:t.version}));}if(d.deleteCar){const c=state.cars.find(x=>x.id===d.deleteCar);openModal('Xóa xe '+c.plate,'<p>Xóa xe sẽ xóa giao dịch và tệp đính kèm liên quan.</p><label>Nhập biển số để xác nhận</label><input name="confirmation" required>',async f=>call('deleteCar',{id:c.id,version:c.version,confirmation:f.get('confirmation')}));}if(d.deleteUser&&confirm('Xóa tài khoản này?'))run(()=>call('deleteUser',{id:d.deleteUser}));if(d.journal)run(async()=>{const fileId=await connection.pick();await call('connectJournal',{id:d.journal,fileId});await call('read');});if(d.view)run(()=>connection.pick(state.users.find(u=>u.id===d.view).viewId));if(d.invite)openModal('Gửi lại email lời mời','<label>Mật khẩu mở lời mời mới</label><input name="invitePassword" type="password" minlength="6" required>',async f=>{await connection.ensureGmail('send');const r=await call('inviteUser',{id:d.invite,invitePassword:f.get('invitePassword')});await sendInvite(state.users.find(u=>u.id===d.invite).email,r.invitation);});if(d.file)run(async()=>{const r=await call('attachment',{id:d.file,transactionId:d.kind==='transaction'?d.record:undefined,carId:d.kind==='car'?d.record:undefined});const bytes=Uint8Array.from(atob(r.file.base64),c=>c.charCodeAt(0));download(bytes,r.file.name,'application/octet-stream');});};
start();
</script></body></html>
