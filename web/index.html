function bindGoogleLogin(){const form=$('#open'),revision=gateRevision;let pending=false,manualQueued=false;form.onsubmit=async e=>{e.preventDefault();if(manualQueued||revision!==gateRevision)return;manualQueued=true;while(pending&&revision===gateRevision)await new Promise(resolve=>setTimeout(resolve,0));if(revision!==gateRevision){manualQueued=false;return;}pending=true;try{await busy(e.submitter||form.querySelector('button'),async()=>{const result=await loginWithGoogle(readForm(form));if(result&&revision===gateRevision)accept(result);});}finally{pending=false;manualQueued=false;}};$('#biometricLogin')?.addEventListener('click',e=>busy(e.target,async()=>{if(pending)return;pending=true;const revision=gateRevision;try{if(!secondaryConnection?.connected()){await secondaryConnection.initialize('',{picker:false});await secondaryConnection.ensureConnected();}if(revision!==gateRevision)return;const login=await biometrics.unlock();if(revision!==gateRevision)return;const f=new FormData();for(const k of ['username','password'])f.set(k,login[k]);f.set('biometricUserId',login.userId);f.set('biometricOrgId',login.orgId);try{const result=await loginWithGoogle(f);if(result&&revision===gateRevision)accept(result);}catch(e){if(e.code!=='ACCOUNT_NOT_FOUND'&&e.status)throw e;throw new Error('Không đăng nhập được bằng thông tin vân tay. Nếu mật khẩu đã đổi, hãy đăng nhập bằng mật khẩu mới và bật lại vân tay.');}}catch(e){throw new Error(biometricError(e));}finally{pending=false;}}));}

async function loginWithGoogle(f){const username=normalizeUsername(f.get('username')),password=f.get('password');if(username==='admin'&&!connection?.connected())return requestAdminConnections(null,f);try{await secondaryConnection.ensureConnected();const makeService=primary=>new DualService(new DualDrive(primary?connection.drive:null,secondaryConnection.drive,primary?connection.identity.email:'',secondaryConnection.identity.email));let candidateService=makeService(false),selected;try{selected=await candidateService.resolveNamed(username,password);}catch(e){if(e.code!=='ACCOUNT_NOT_FOUND'||!connection?.identity)throw e;if(!connection.connected())return requestAdminConnections(null,f);await connection.ensureConnected();candidateService=makeService(true);selected=await candidateService.resolveNamed(username,password);}if(f.get('biometricUserId')&&(selected.account.userId!==f.get('biometricUserId')||selected.account.orgId!==f.get('biometricOrgId')))throw new Error('Tài khoản vân tay không còn khớp. Hãy đăng nhập bằng mật khẩu.');if(selected.account.role==='admin'){const expected=selected.account.ownerEmail?.toLowerCase();if(!connection?.connected()||connection.identity.email.toLowerCase()!==expected)return requestAdminConnections(selected.account,f);await connection.ensureConnected();candidateService.drive.primary=connection.drive;candidateService.drive.primaryEmail=connection.identity.email.toLowerCase();service=candidateService;}else service=candidateService;service.drive.sources.set(selected.profileId,selected.storageSource);const result=await service.login(selected.profileId,password);mode=selected.account.role==='admin'?'admin':'member';rememberGoogleMode();adminStorageHint=null;return result;}catch(e){if(e.status===401){connection?.invalidate();secondaryConnection?.invalidate();throw new Error('Phiên Google cần cấp lại. Bấm Đăng nhập một lần nữa để tiếp tục với Google đã dùng.');}throw e;}}

async function finishGoogleConnection(){const form=pendingGoogleLogin;pendingGoogleLogin=null;if(transferConnectionFlow){transferConnectionFlow=false;service=new DualService(new DualDrive(connection.drive,secondaryConnection.drive,connection.identity.email,secondaryConnection.identity.email));transferReadyGate();transferDialog();return;}if(!form){await openGoogleProfiles();return;}const revision=gateRevision;try{const result=await loginWithGoogle(form);if(result&&revision===gateRevision)accept(result);}catch(e){if(revision!==gateRevision)return;knownGoogleLogin();errorAt('#gateError',e);}}

async function profilesGate(){const revision=gateRevision,current=service;const profiles=[...(current.drive.primary?await current.drive.profiles():[]),...await current.drive.memberProfiles()];if(revision!==gateRevision||current!==service)return;if(mode==='admin'&&!profiles.length){createGate();return;}gate('<h2>Đăng nhập</h2>'+loginForm());bindGoogleLogin();}

async function readTransferFile(file){if(!file||file.size>400*1024*1024)throw new Error('Chọn bản sao lưu tối đa 400 MB.');const signature=new Uint8Array(await file.slice(0,4).arrayBuffer());if(signature[0]===80&&signature[1]===75||/\.zip$/i.test(file.name)){const zip=await JSZip.loadAsync(file),entry=zip.file('so-xe-to-chuc.enc.json');if(!entry||entry._data.uncompressedSize>400*1024*1024)throw new Error('ZIP không phải bản sao lưu Sổ Xe Tổ Chức hợp lệ.');return entry.async('string');}return file.text();}

function managementReport(){const driver=state.me.role==='driver',selected=driver?state.me.id:managementUserId,list=managementPeriods(state,{...filters,userId:selected}),allowed=state.users.filter(u=>u.role==='driver'&&(!driver||u.id===state.me.id)),users=allowed.filter(u=>!selected||u.id===selected);return '<section class="card"><h2>Thời gian quản lý xe</h2><p class="muted">Theo xe và khoảng ngày đang lọc. Thời gian tính đến hiện tại; cộng riêng từng xe. Dòng xe đang quản lý được in đậm.</p><label>Người quản lý/lái xe</label><select id="managementUser"'+(driver?' disabled':'')+'>'+(driver?'':'<option value="">Tất cả NSD</option>')+options(allowed.map(u=>({id:u.id,label:u.name})),selected)+'</select><div class="actions"><button id="exportManagement" class="secondary">Xuất Excel thời gian quản lý</button></div><div class="table-wrap"><table id="managementSummary"><thead><tr><th>Người quản lý/lái xe</th><th>Số xe</th><th>Số giai đoạn</th><th>Tổng thời gian</th></tr></thead><tbody>'+users.map(u=>{const rows=list.filter(a=>a.userId===u.id);return '<tr><td>'+esc(u.name)+'</td><td>'+new Set(rows.map(a=>a.carId)).size+'</td><td>'+rows.length+'</td><td>'+esc(rows.length?durationText(rows.reduce((sum,a)=>sum+a.milliseconds,0)):'Chưa có thời gian quản lý')+'</td></tr>';}).join('')+'</tbody></table></div><div class="table-wrap"><table id="managementPeriods"><thead><tr><th>NSD</th><th>Xe</th><th>Từ ngày giờ</th><th>Đến ngày giờ</th><th>Thời gian</th></tr></thead><tbody>'+list.map(a=>'<tr class="'+(a.ongoing?'management-ongoing':'')+'"><td>'+esc(name(a.userId))+'</td><td><strong>'+esc(plate(a.carId))+'</strong></td><td>'+esc(timeVN(a.from))+'</td><td>'+esc(timeVN(a.to))+(a.ongoing?' · <strong>Đang quản lý</strong>':'')+'</td><td>'+esc(durationText(a.milliseconds))+'</td></tr>').join('')+'</tbody></table></div>'+(!list.length?'<p class="muted">Không có thời gian quản lý trong bộ lọc.</p>':'')+'</section>';}
function bindManagementReport(){$('#managementUser').onchange=e=>{managementUserId=e.target.value;render();};$('#exportManagement').onclick=()=>{const rows=managementPeriods(state,{...filters,userId:state.me.role==='driver'?state.me.id:managementUserId});download(excelDocument('Thời gian quản lý',['NSD','Xe','Từ ngày giờ','Đến ngày giờ','Thời gian','Tổng giờ','Trạng thái'],rows.map(a=>[name(a.userId),plate(a.carId),timeVN(a.from),timeVN(a.to),durationText(a.milliseconds),Math.round(a.milliseconds/3600000*10000)/10000,a.ongoing?'Đang quản lý':'Đã kết thúc'])),'so-xe-thoi-gian-quan-ly-'+today()+'.xls','application/vnd.ms-excel');};}

function renderSettings(){$('#content').innerHTML='<div class="card"><h2>Tổ chức</h2><label>Tên tổ chức</label><input id="rename" value="'+esc(state.organization.name)+'"><button id="renameButton">Lưu tên</button></div><div class="card"><h2>Hai tài khoản lưu dữ liệu</h2><p>Google dữ liệu Admin: <strong>'+esc(state.storage.primaryEmail)+'</strong></p><button id="reconnect">Kết nối lại Google Admin</button><p>TK Google lưu dữ liệu NSD: <strong>'+esc(state.storage.secondaryEmail)+'</strong></p><button id="reconnectSecondary">Kết nối lại TK Google lưu dữ liệu NSD</button><p><button id="forgetGoogle" class="secondary">Ngắt kết nối Google trên thiết bị</button></p><p class="muted">TK Google lưu dữ liệu NSD được gắn với tổ chức. Chọn Google khác sẽ bị từ chối để tránh ghi dữ liệu sai tài khoản.</p></div><div class="card backup-section"><div class="backup-heading"><div><h2>Sao lưu &amp; Phục hồi</h2><small>Bản dự phòng đầy đủ cho dữ liệu tổ chức và tệp đính kèm.</small></div><span class="backup-badge">Mật khẩu bảo vệ</span></div><div class="backup-grid"><section class="backup-panel"><h3>↓ Sao lưu dữ liệu</h3><p>Bao gồm xe, NSD, phân công, bàn giao, giao dịch, giấy chủ quyền và toàn bộ tệp đính kèm.</p><button id="exportButton" class="backup-main">Tải bản sao lưu đầy đủ (.zip)</button><small>Tệp ZIP được bảo vệ bằng mật khẩu bạn đặt khi sao lưu.</small></section><section class="backup-panel"><h3>↥ Phục hồi dữ liệu</h3><p>Chọn bản sao lưu của tổ chức này, kiểm tra thông tin và xác nhận trước khi thay dữ liệu.</p><button id="restoreButton" class="secondary backup-main">Chọn bản sao lưu để phục hồi</button><small>Hỗ trợ ZIP đầy đủ và file JSON mã hóa đã sao lưu trước đây.</small></section><section class="backup-panel"><h3>⇄ Chuyển sang hai Google mới</h3><p>Dùng bản sao lưu đầy đủ để phục hồi tổ chức sang Google Admin mới và Google NSD mới.</p><button id="transferStorage" class="secondary backup-main">Phục hồi từ hai Google cũ</button><small>Ứng dụng sẽ kết thúc phiên hiện tại và yêu cầu chọn lại cả hai Google mới.</small></section></div></div><div class="card"><h2>Xóa tổ chức</h2><p>Xóa dữ liệu tổ chức và các file tài khoản, nhật ký, bản dữ liệu NSD trên hai Google. Cần xác nhận bằng tên tổ chức và mật khẩu Admin.</p><button id="deleteOrg" class="danger">Xóa tổ chức</button></div>';$('#renameButton').onclick=()=>run(()=>call('renameOrganization',{name:$('#rename').value}));$('#reconnect').onclick=e=>busy(e.target,()=>connection.ensureConnected({refresh:true}),'#status');$('#reconnectSecondary').onclick=e=>busy(e.target,()=>secondaryConnection.ensureConnected({refresh:true}),'#status');$('#forgetGoogle').onclick=disconnectGoogle;$('#exportButton').onclick=backupDialog;$('#restoreButton').onclick=restoreDialog;$('#transferStorage').onclick=startTransferConnections;$('#deleteOrg').onclick=()=>deleteOrg(state.organization.name);}
function backupDialog(){openModal('Sao lưu đầy đủ','<p class="muted">Dữ liệu và tệp đính kèm được gom vào một bản sao có mật khẩu bảo vệ.</p><label>Mật khẩu bảo vệ bản sao</label><input name="password" type="password" minlength="6" required autocomplete="new-password"><label>Nhập lại mật khẩu</label><input name="confirmPassword" type="password" required autocomplete="new-password">',async f=>{if(f.get('password')!==f.get('confirmPassword'))throw new Error('Mật khẩu nhập lại không khớp.');const r=await call('export',{password:f.get('password')});const zip=new JSZip();zip.file('so-xe-to-chuc.enc.json',r.backup);zip.file('HUONG-DAN.txt','Sổ Xe Tổ Chức – bản sao lưu đầy đủ.\nVào Tổ chức → Sao lưu & Phục hồi, chọn ZIP này và nhập mật khẩu sao lưu.\nDữ liệu, tài khoản và tệp đính kèm đều nằm trong JSON mã hóa. Tại đây có thể phục hồi tổ chức hiện tại hoặc chọn Phục hồi từ hai Google cũ để chuyển sang hai Google mới.\n');download(await zip.generateAsync({type:'blob',compression:'STORE'}),'So-Xe-To-Chuc-'+today()+'.zip','application/zip');$('#status').textContent='Đã tải bản sao lưu đầy đủ: '+r.summary.cars+' xe, '+r.summary.transactions+' giao dịch, '+r.summary.attachments+' tệp đính kèm.';});$('#modalSubmit').textContent='Tạo bản sao lưu';}
function restoreDialog(){let payload='';openModal('Phục hồi dữ liệu','<label>Bản sao lưu (.zip hoặc .json)</label><input id="restoreFile" type="file" accept=".zip,.json,application/zip,application/json" required><label>Mật khẩu bản sao lưu</label><input name="password" type="password" required><p class="muted">Bước tiếp theo sẽ hiển thị thông tin bản sao lưu để kiểm tra.</p>',async f=>{const file=$('#restoreFile').files[0];if(!file||file.size>400*1024*1024)throw new Error('Chọn bản sao lưu tối đa 400 MB.');const signature=new Uint8Array(await file.slice(0,4).arrayBuffer());if(signature[0]===80&&signature[1]===75||/\.zip$/i.test(file.name)){const zip=await JSZip.loadAsync(file,{checkCRC32:false}),entry=zip.file('so-xe-to-chuc.enc.json');if(!entry||entry._data.uncompressedSize>400*1024*1024)throw new Error('ZIP không phải bản sao lưu Sổ Xe Tổ Chức hợp lệ.');payload=await entry.async('string');}else payload=await file.text();const password=f.get('password'),r=await call('inspectBackup',{backup:payload,password});setTimeout(()=>restoreConfirm(payload,password,r.summary),0);});$('#modalSubmit').textContent='Kiểm tra bản sao lưu';}
function restoreConfirm(backup,password,info){const revision=state.revision;openModal('Xác nhận phục hồi','<p><strong>'+esc(info.organizationName)+'</strong> · '+esc(new Date(info.createdAt).toLocaleString('vi-VN'))+'</p><div class="backup-summary">'+[['Xe',info.cars],['Giao dịch',info.transactions],['NSD',info.users],['Tệp đính kèm',info.attachments]].map(([label,n])=>'<div><small>'+label+'</small><strong>'+n+'</strong></div>').join('')+'</div><p class="notice">Dữ liệu hiện tại sẽ được thay bằng bản sao này, bao gồm tệp đính kèm. '+(info.complete?'Tên đăng nhập và mật khẩu trở về thời điểm sao lưu.':'Bản JSON cũ giữ mật khẩu hiện tại; cần các file tài khoản NSD còn trên Drive.')+' Hãy sao lưu hiện tại trước khi tiếp tục. Sau phục hồi, hãy đăng nhập lại.</p><label>Nhập tên tổ chức hiện tại để xác nhận</label><input name="confirmation" required autocomplete="off"><label>Mật khẩu Admin đang đăng nhập</label><input name="adminPassword" type="password" required autocomplete="off">',async f=>{const r=await call('restoreBackup',{backup,password,expectedRevision:revision,confirmation:f.get('confirmation'),adminPassword:f.get('adminPassword')});if(r.restored){logout();setTimeout(()=>alert('Đã phục hồi dữ liệu và tệp đính kèm.'+(r.warnings?.length?' '+r.warnings.join(' · '):'')+(info.complete?' Đăng nhập lại bằng mật khẩu tại thời điểm sao lưu.':' Đăng nhập lại bằng mật khẩu hiện tại.')),0);}});$('#modalSubmit').textContent='Xác nhận phục hồi';}
let fileContext=null,previewUrl=null;
function fileButtons(f,kind,record){return '<div class="row"><button class="secondary" type="button" data-file="'+esc(f.id)+'" data-view-file="true" data-kind="'+kind+'" data-record="'+record+'">Xem</button><button class="secondary" type="button" data-file="'+esc(f.id)+'" data-kind="'+kind+'" data-record="'+record+'">Tải</button></div>';}
async function openFile(file,view=true){const bytes=Uint8Array.from(atob(file.base64),c=>c.charCodeAt(0)),type=file.type||'application/octet-stream';if(!view)return download(bytes,file.name,type);const dialog=$('#filePreview');if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(new Blob([bytes],{type}));$('#filePreviewTitle').textContent=file.name;$('#filePreviewBody').replaceChildren();let node;if(['image/png','image/jpeg','image/gif','image/webp'].includes(type)){node=document.createElement('img');node.src=previewUrl;node.alt=file.name;}else if(type==='application/pdf'){node=document.createElement('iframe');node.src=previewUrl;node.title=file.name;node.setAttribute('sandbox','');}else{node=document.createElement('p');node.textContent='Loại tệp này cần tải về để mở trên thiết bị.';}$('#filePreviewBody').append(node);$('#downloadPreview').onclick=()=>download(bytes,file.name,type);dialog.showModal();}
function deleteOrg(n){openModal('Xóa tổ chức','<p>Nhập đúng tên '+esc(n)+' và mật khẩu riêng để xác nhận.</p><label>Tên tổ chức</label><input name="confirmation" required><label>Mật khẩu</label><input name="password" type="password" required>',async f=>{const r=await call('deleteOrganization',Object.fromEntries(f));if(r.deleted)logout();});}

function fileList(list,kind,id){return (list||[]).map(f=>'<div class="file-row"><small>'+esc(f.name)+'</small>'+fileButtons(f,kind,id)+'</div>').join('');}
function openModal(title,html,handler,existingFiles=[]){operationId=crypto.randomUUID();$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalError').hidden=true;modalHandler=handler;files=existingFiles.map(f=>({...f}));$('#modalSubmit').hidden=false;$('#modalSubmit').textContent=title.startsWith('Xóa')?'Xác nhận xóa':'Lưu';setupDateInputs($('#modalBody'));setupPasswordInputs($('#modalBody'));bindMoneyInputs($('#modalBody'));$('#modal').showModal();if($('#fileInput')){$('#fileInput').onchange=async e=>{try{const additions=[];for(const f of e.target.files){if(f.size>2*1024*1024)throw new Error('Mỗi tệp tối đa 2 MB.');const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f);});additions.push({name:f.name,type:f.type,base64});}if(files.length+additions.length>5)throw new Error('Tối đa 5 tệp.');files.push(...additions);renderEditFiles();}catch(err){errorAt('#modalError',err);}finally{e.target.value='';}};renderEditFiles();}}
function renderEditFiles(){$('#editFiles').innerHTML=files.map((f,i)=>'<div class="file-row"><span>'+esc(f.name)+'<br><small>'+((f.size||Math.floor((f.base64?.length||0)*3/4))/1024).toFixed(1)+' KB</small></span><div class="row"><button class="secondary" type="button" data-preview-edit-file="'+i+'">Xem / tải</button><button class="danger" type="button" data-remove-file="'+i+'">Xóa</button></div></div>').join('');$('#editFiles').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.removeFile!==undefined){files.splice(Number(b.dataset.removeFile),1);renderEditFiles();}if(b.dataset.previewEditFile!==undefined)run(async()=>{const f=files[Number(b.dataset.previewEditFile)],r=f.id?await call('attachment',{id:f.id,...(fileContext?.kind==='car'?{carId:fileContext.id}:{transactionId:fileContext?.id})}):{file:f};await openFile(r.file);});};}
const fileEditor='<label>Tệp đính kèm</label><div class="file-drop"><input id="fileInput" type="file" multiple><small>Tối đa 5 tệp, mỗi tệp 2 MB. Tệp tự đổi tên theo _Biển số_Loại_YYYYMMDD, thêm số thứ tự khi trùng; giữ phần mở rộng. Tệp mới lưu trên Drive khi bấm Lưu. Xóa tệp sẽ áp dụng khi lưu bản ghi.</small><div id="editFiles"></div></div>';
function editCar(id){fileContext={kind:'car',id};const c=state.cars.find(x=>x.id===id)||{};openModal(id?'Sửa xe':'Thêm xe','<label>Biển số</label><input name="plate" required value="'+esc(c.plate)+'"><label>Tên xe</label><input name="name" required value="'+esc(c.name)+'"><div class="grid"><div><label>Năm sản xuất</label><input name="year" pattern="[0-9]{4}" value="'+esc(c.year)+'"></div><div><label>Loại động cơ</label><select name="powerType">'+options([{id:'fuel',label:'Xăng / Dầu'},{id:'electric',label:'Điện'},{id:'hybrid',label:'Điện – Xăng'}],c.powerType||'fuel')+'</select></div><div><label>ODO hiện tại (km)</label><input name="odo" type="number" min="0" max="10000000" value="'+(c.odo||0)+'"></div></div>'+fileEditor,async f=>call('saveCar',{id:c.id,version:c.version,plate:f.get('plate'),name:f.get('name'),year:f.get('year'),powerType:f.get('powerType'),odo:Number(f.get('odo')),attachments:files}),c.attachments||[]);}
function expenseTypeFields(){const category=$('#modalBody [name=category]').value;for(const group of $('#modalBody').querySelectorAll('[data-categories]'))group.hidden=!group.dataset.categories.split(' ').includes(category);}
function bindFuelCalculation(){const form=$('#modalBody'),amount=form.querySelector('[name=amount]'),price=form.querySelector('[name=fuelPrice]'),liters=form.querySelector('[name=liters]');let basis=moneyFieldNumber(price.value)>0?'price':'liters';for(const [input,source] of [[amount,'amount'],[price,'price'],[liters,'liters']])input.addEventListener('input',()=>{if(form.querySelector('[name=category]').value!=='fuel')return;if(source!=='amount')basis=source;const changes=calculateFuel(moneyFieldNumber(amount.value),moneyFieldNumber(price.value),liters.value,source,basis);for(const [key,value] of Object.entries(changes)){const target=form.querySelector('[name='+key+']');target.value=key==='fuelPrice'&&value!==''?moneyInputValue(value,2):value;if(key==='fuelPrice')target.setCustomValidity(Number(value)>1e12?'Đơn giá vượt giới hạn.':'');}});}
function canEditTransaction(t){return admin()||state.me.role==='driver'&&t.enteredBy===state.me.id&&state.carChoices.some(c=>c.id===t.carId&&c.assignedUserId===state.me.id);}
function bindVehicleEntry(t,selected){const car=$('#modalBody [name=carId]'),who=$('#modalBody [name=enteredFor]'),check=$('#onBehalfCheck');if(!check)return;check.checked=!!t.id&&(t.onBehalf||t.enteredFor!==t.enteredBy||!state.carChoices.some(c=>c.id===t.carId&&c.assignedUserId===state.me.id));function updateCars(){const chosen=car.value||selected,list=check.checked?state.carChoices:state.carChoices.filter(c=>c.assignedUserId===state.me.id);car.innerHTML=list.length?options(list.map(c=>({id:c.id,label:c.plate+' · '+c.name})),chosen):'<option value="">Chưa có xe được phân công</option>';who.disabled=!check.checked;if(!check.checked)who.value=state.me.id;else if(!t.id){const owner=state.carChoices.find(c=>c.id===car.value)?.assignedUserId;who.value=owner&&[...who.options].some(o=>o.value===owner)?owner:state.me.id;}who.onchange();$('#onBehalf').textContent+=' · '+(check.checked?'Nhập hộ xe '+plate(car.value):'Xe đang quản lý');}check.onchange=updateCars;car.onchange=()=>{if(check.checked){const owner=state.carChoices.find(c=>c.id===car.value)?.assignedUserId;who.value=owner&&[...who.options].some(o=>o.value===owner)?owner:state.me.id;}who.onchange();if(check.checked)$('#onBehalf').textContent+=' · Nhập hộ xe '+plate(car.value);};updateCars();}
function editTransaction(id){fileContext={kind:'transaction',id};const t=state.transactions.find(x=>x.id===id)||{};if(id&&!canEditTransaction(t))return alert('Chỉ được sửa giao dịch do mình nhập.');const managed=state.carChoices.filter(c=>c.assignedUserId===state.me.id),selected=t.carId||(admin()?state.carChoices[0]?.id:managed[0]?.id)||'';if(!state.carChoices.length)return alert('Admin cần nhập xe trước.');const entryOptions=state.users.filter(u=>u.role==='driver'||u.id===state.me.id).map(u=>({id:u.id,label:u.name}));openModal(id?'Sửa chi phí':'Nhập chi phí',(admin()?'':'<label class="check-row"><input id="onBehalfCheck" name="onBehalf" type="checkbox"> Nhập hộ</label>')+'<div class="grid"><div><label>Xe</label><select name="carId" required>'+options(state.carChoices.map(c=>({id:c.id,label:c.plate+' · '+c.name})),selected)+'</select></div><div><label>Ngày giao dịch</label><input name="date" type="date" required value="'+(t.date||today())+'"></div><div><label>Loại chi phí</label><select name="category">'+options(Object.entries(categories).map(([id,label])=>({id,label})),t.category)+'</select></div></div><label>Nội dung chi phí</label><input name="description" maxlength="1000" value="'+esc(t.description)+'"><div class="grid"><div><label>Số tiền (đồng)</label><input name="amount" data-money="0" type="number" min="0" max="1000000000000" required value="'+(t.amount||0)+'"></div><div><label>ODO (km)</label><input name="odo" type="number" min="0" max="10000000" required value="'+(t.odo||0)+'"></div></div><p data-categories="fuel" class="muted">Nhập tổng tiền và đơn giá để tính số lít; nhập số lít để tính đơn giá. Tổng tiền giữ nguyên.</p><div data-categories="fuel" class="grid"><div><label>Đơn giá xăng (đồng/lít)</label><input name="fuelPrice" data-money="2" type="number" min="0" step="0.01" value="'+(t.fuelPrice||0)+'"></div><div><label>Số lít</label><input name="liters" type="number" min="0" step="0.001" value="'+(t.liters||0)+'"></div></div><div data-categories="charge" class="grid"><div><label>Pin trước sạc (%)</label><input name="batteryFrom" type="number" min="0" max="100" value="'+(t.batteryFrom||0)+'"></div><div><label>Pin sau sạc (%)</label><input name="batteryTo" type="number" min="0" max="100" value="'+(t.batteryTo||0)+'"></div></div><div data-categories="maintenance parts" class="grid"><div><label>Chu kỳ (km)</label><input name="repeatKm" type="number" min="0" value="'+(t.repeatKm||0)+'"></div><div><label>Chu kỳ (tháng)</label><input name="repeatMonths" type="number" min="0" value="'+(t.repeatMonths||0)+'"></div></div><div data-categories="insurance inspection road_fee"><div class="grid"><div><label>Đơn vị / Nhà cung cấp</label><input name="insuranceProvider" value="'+esc(t.insuranceProvider)+'"></div><div><label>Số hợp đồng / Số chứng nhận</label><input name="insurancePolicy" value="'+esc(t.insurancePolicy)+'"></div><div><label>Ngày hiệu lực</label><input name="insuranceStart" type="date" value="'+esc(t.insuranceStart)+'"></div><div><label>Ngày hết hạn</label><input name="insuranceExpiry" type="date" value="'+esc(t.insuranceExpiry)+'"></div></div></div><label>Người được ghi nhận chi phí</label><select name="enteredFor">'+options(entryOptions,t.enteredFor||state.me.id)+'</select><p id="onBehalf" class="notice"></p><label>Ghi chú</label><textarea name="note" maxlength="2000">'+esc(t.note)+'</textarea>'+fileEditor,async f=>{const a=Object.fromEntries(f);a.onBehalf=f.get('onBehalf')==='on';if(!a.carId)throw new Error('Chưa có xe được phân công. Bật Nhập hộ để chọn xe khác.');if(!a.enteredFor)a.enteredFor=state.me.id;for(const k of ['amount','odo','fuelPrice','liters','batteryFrom','batteryTo','repeatKm','repeatMonths'])a[k]=Number(a[k]||0);await call('saveTransaction',{...a,id:t.id,version:t.version,attachments:files});},t.attachments||[]);$('#modalBody [name=category]').onchange=expenseTypeFields;expenseTypeFields();const enteredFor=$('#modalBody [name=enteredFor]'),update=()=>{$('#onBehalf').textContent=enteredFor.value===(t.enteredBy||state.me.id)?'Người nhập: '+name(t.enteredBy||state.me.id):'Người nhập: '+name(t.enteredBy||state.me.id)+' · Nhập hộ: '+name(enteredFor.value);};enteredFor.onchange=update;update();bindVehicleEntry(t,selected);bindFuelCalculation();}
function assignCar(id){const drivers=state.users.filter(u=>u.role==='driver');if(!drivers.length)return alert('Hãy tạo tài khoản lái xe trước.');openModal('Phân công '+plate(id),'<label>Người quản lý/lái xe</label><select name="userId">'+'<option value="">Chưa phân công / Bỏ phân công</option>'+options(drivers.map(u=>({id:u.id,label:u.name})),state.assignments.find(a=>a.carId===id&&!a.endedAt)?.userId)+'</select>',async f=>call('assign',{carId:id,userId:f.get('userId')}));}
function download(content,filename,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
async function run(fn){const current=service;$('#status').textContent='Đang xử lý…';try{await fn();}catch(e){if(current!==service)return;$('#status').textContent=e.message;alert(e.message);}}
function createUser(){openModal('Tạo tài khoản NSD','<label>Họ tên</label><input name="name" required><label>Tên định danh</label><input name="username" required maxlength="80" autocapitalize="none" spellcheck="false"><p class="muted">3–40 ký tự. Chữ có dấu được chấp nhận; khoảng trắng đổi thành gạch dưới. Tên đăng nhập đã lưu: <strong id="usernamePreview">—</strong></p><label>Vai trò</label><select name="role"><option value="driver">Người quản lý/lái xe</option><option value="viewer">Admin chỉ xem</option><option value="admin">Admin bổ sung (kết nối cả hai Google)</option></select><label>Mật khẩu ban đầu (gửi riêng cho NSD)</label><input name="initialPassword" type="password" minlength="6" required value="000000" autocomplete="new-password"><p class="muted">NSD bắt buộc đổi mật khẩu lần đầu. Tài khoản tự ghi sang TK Google lưu dữ liệu NSD.</p>',async f=>{const a=Object.fromEntries(f);a.username=normalizeUsername(a.username);await call('createUser',a);$('#status').textContent+=' · Đã tạo tài khoản trên TK Google lưu dữ liệu NSD. Gửi tên đăng nhập '+a.username+' và mật khẩu ban đầu cho NSD.';});$('#modal [name=username]').oninput=e=>{$('#usernamePreview').textContent=normalizeUsername(e.target.value)||'—';};}
function editUser(id){const u=state.users.find(u=>u.id===id);openModal('Sửa NSD','<label>Họ tên</label><input name="name" required maxlength="80" value="'+esc(u.name)+'"><label>Tên đăng nhập</label><input name="username" required maxlength="80" autocapitalize="none" spellcheck="false" value="'+esc(u.username)+'"><label>Vai trò</label><input readonly value="'+esc(roles[u.role])+'"><label>Đặt lại mật khẩu đăng nhập (để trống nếu giữ nguyên)</label><input name="newPassword" type="password" minlength="6" maxlength="128" autocomplete="new-password"><label>Nhập lại mật khẩu mới</label><input name="confirmPassword" type="password" autocomplete="new-password"><p class="muted">Sau khi đặt lại, NSD phải đăng nhập bằng mật khẩu mới và đổi mật khẩu trước khi dùng tiếp.</p>',async f=>{if(f.get('newPassword')!==f.get('confirmPassword'))throw new Error('Mật khẩu nhập lại không khớp.');await call('editUser',{id,version:u.editVersion||0,name:f.get('name'),username:normalizeUsername(f.get('username')),newPassword:f.get('newPassword')});});}

$('#modalForm').onsubmit=e=>{e.preventDefault();const title=$('#modalTitle').textContent,processing=title==='Sao lưu đầy đủ'?'Đang sao lưu giao dịch và tệp đính kèm…':title==='Phục hồi dữ liệu'||title==='Xác nhận phục hồi'?'Đang phục hồi dữ liệu và tệp đính kèm…':title==='Phục hồi từ hai Google cũ'?'Đang kiểm tra bản sao lưu đầy đủ…':title==='Xác nhận chuyển dữ liệu'?'Đang phục hồi dữ liệu và tệp sang hai Google mới…':title==='Kiểm tra bản sao lưu'?'Đang kiểm tra bản sao lưu…':'Đang xử lý, vui lòng chờ…';busy(e.submitter,async()=>{await modalHandler(readForm(e.target));$('#modal').close();},'#modalError',processing);};$('#closeModal').onclick=()=>$('#modal').close();
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();}};
$('#reload').onclick=()=>run(()=>call('read'));$('#googleReconnect').onclick=()=>openModal('Kết nối lại Google','<p>Kết nối từng Google bằng nút bên dưới. Chọn đúng tài khoản đã đăng ký.</p>'+(service.drive.primary?'<button type="button" id="reauthorizeAdmin" class="secondary">Google dữ liệu Admin</button> ':'')+'<button type="button" id="reauthorizeMember" class="secondary">TK Google lưu dữ liệu NSD</button>',async()=>{});
$('#modalBody').addEventListener('click',e=>{if(e.target.id==='reauthorizeAdmin')busy(e.target,()=>connection.ensureConnected({refresh:true}),'#modalError');if(e.target.id==='reauthorizeMember')busy(e.target,()=>secondaryConnection.ensureConnected({refresh:true}),'#modalError');});
$('#logout').onclick=logout;
document.querySelector('.account-menu>.row').addEventListener('click',()=>{document.querySelector('.account-menu').classList.remove('open');$('#accountMenu').setAttribute('aria-expanded','false');});
$('#accountMenu').onclick=()=>{const menu=document.querySelector('.account-menu');menu.classList.toggle('open');$('#accountMenu').setAttribute('aria-expanded',String(menu.classList.contains('open')));};
$('#biometricSettings').onclick=()=>{openModal('Đăng nhập vân tay','<p>Bật trên điện thoại cá nhân. Thông tin đăng nhập được mã hóa bằng khóa sinh trắc học, chỉ dùng cho tài khoản hiện tại trên thiết bị này.</p><label>Mật khẩu hiện tại</label><input name="password" type="password" required autocomplete="current-password"><p class="muted">Mật khẩu luôn có thể dùng thay thế. Khi đổi mật khẩu, hãy bật lại vân tay.</p>'+(biometrics.saved()?'<button id="forgetBiometric" type="button" class="danger">Tắt vân tay trên thiết bị này</button>':''),async f=>{const selected=await service.resolveNamed(state.me.username,f.get('password'),state.organization.id);service.resolvedProfiles.clear();if(selected.account.userId!==state.me.id)throw new Error('Mật khẩu không đúng tài khoản hiện tại.');try{await biometrics.enroll({username:state.me.username,password:f.get('password'),orgId:state.organization.id,userId:state.me.id});}catch(e){throw new Error(biometricError(e));}$('#status').textContent='Đã bật đăng nhập vân tay trên thiết bị này.';});$('#modalSubmit').textContent='Bật vân tay';$('#forgetBiometric')?.addEventListener('click',()=>{biometrics.forget();$('#modal').close();$('#status').textContent='Đã tắt đăng nhập vân tay trên thiết bị này.';});};
$('#passwordButton').onclick=()=>openModal('Đổi mật khẩu','<label>Mật khẩu hiện tại</label><input name="current" type="password" required autocomplete="off"><label>Mật khẩu mới</label><input name="new" type="password" minlength="6" maxlength="128" required autocomplete="new-password"><label>Nhập lại mật khẩu mới</label><input name="confirm" type="password" required autocomplete="new-password">',async f=>{if(f.get('new')!==f.get('confirm'))throw new Error('Mật khẩu nhập lại không khớp.');await call('changePassword',{currentPassword:f.get('current'),password:f.get('new')});biometrics.forget();});
$('#content').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.viewTransaction)showReminderTransaction(d.viewTransaction);if(d.viewHandover)showHandover(d.viewHandover);if(d.editHandover)editHandover(d.editHandover);if(d.deleteHandover)deleteHandover(d.deleteHandover);if(d.carHandover)editHandover(undefined,d.carHandover);if(d.reminderTransaction)showReminderTransaction(d.reminderTransaction);if(d.costCategory){const date=today(),year=Number(date.slice(0,4)),month=Number(date.slice(5,7));filters={carId:'',category:d.costCategory,from:date.slice(0,7)+'-01',to:new Date(Date.UTC(year,month,0)).toISOString().slice(0,10)};tab='transactions';render();}if(d.editCar)editCar(d.editCar);if(d.assignCar)assignCar(d.assignCar);if(d.editTransaction)editTransaction(d.editTransaction);if(d.deleteTransaction){const t=state.transactions.find(x=>x.id===d.deleteTransaction);if(confirm('Xóa giao dịch và tất cả tệp đính kèm của giao dịch?'))run(()=>call('deleteTransaction',{id:t.id,version:t.version}));}if(d.deleteCar){const c=state.cars.find(x=>x.id===d.deleteCar);openModal('Xóa xe '+c.plate,'<p>Xóa xe sẽ xóa giao dịch và tệp đính kèm liên quan.</p><label>Nhập biển số để xác nhận</label><input name="confirmation" required>',async f=>call('deleteCar',{id:c.id,version:c.version,confirmation:f.get('confirmation')}));}if(d.editUser)editUser(d.editUser);if(d.deleteUser&&confirm('Xóa tài khoản này?'))run(()=>call('deleteUser',{id:d.deleteUser}));if(d.file)run(async()=>{const r=await call('attachment',{id:d.file,transactionId:d.kind==='transaction'?d.record:undefined,carId:d.kind==='car'?d.record:undefined});await openFile(r.file,!!d.viewFile);});};
$('#closePreview').onclick=()=>$('#filePreview').close();$('#filePreview').addEventListener('close',()=>{if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;$('#filePreviewBody').replaceChildren();});
restoreGoogleLogin().catch(e=>{start();errorAt('#gateError',e);});
</script></body></html>
