name: Deploy Sổ Xe Tổ Chức v2 Web

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Apps Script service URL
        env:
          APPS_SCRIPT_WEB_APP_URL: ${{ secrets.APPS_SCRIPT_WEB_APP_URL }}
        run: |
          if [ -n "$APPS_SCRIPT_WEB_APP_URL" ]; then
            node -e "require('fs').writeFileSync('docs/sheets-config.js', 'window.SO_XE_SHEETS_CONFIG = Object.freeze({serviceUrl: '+JSON.stringify(process.env.APPS_SCRIPT_WEB_APP_URL)+'});\\n')"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
