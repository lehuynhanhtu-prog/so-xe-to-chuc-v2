<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sổ Xe Tổ Chức</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#142b43;background:#f4f7fb;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:#176a65;color:white;font-weight:600}button.secondary{background:#e8f0f5;color:#24435c}button.danger{background:#fff0ef;color:#a52c26}button:disabled{opacity:.5;cursor:wait}a{color:#176a65}input,select,textarea{width:100%;border:1px solid #cedae4;border-radius:9px;padding:11px;background:white;color:inherit}label{display:block;margin:14px 0 6px;font-weight:600}small,.muted{color:#60758a}h1{font-size:27px;line-height:1.2;margin:10px 0}h2{font-size:21px;margin:0 0 18px}h3{font-size:17px}.shell{max-width:1150px;margin:auto;padding:24px}.gate{max-width:490px;margin:5vh auto;padding:32px;background:white;border:1px solid #dfE7ef;border-radius:18px;box-shadow:0 12px 45px #1632470c}.brand{display:flex;align-items:center;gap:13px;margin-bottom:23px}.logo{width:43px;height:43px;display:grid;place-items:center;border-radius:12px;background:#176a65;color:white;font-size:23px}.brand strong{font-size:19px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{border:1px solid #dfe7ef;background:white;border-radius:14px;padding:22px;margin-bottom:18px}.stat{font-size:28px;font-weight:700;margin-top:7px}nav{display:flex;gap:8px;margin:22px 0;flex-wrap:wrap}nav button{background:transparent;color:#60758a}nav button.active{color:#176a65;background:#e0f0eb}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:14px 10px;border-bottom:1px solid #e9eef3;vertical-align:top}th{font-size:13px;color:#60758a}td button{padding:7px 10px;font-size:13px}.empty{padding:30px;text-align:center;color:#60758a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.error{padding:12px;background:#fff0ef;color:#a52c26;border-radius:9px;margin:14px 0}.notice{padding:12px;background:#eef7f6;border-radius:9px;font-size:14px;margin:15px 0;line-height:1.6}.steps{font-size:13px;color:#176a65;margin:10px 0 22px}.wide{width:100%;margin-top:20px}dialog{border:0;border-radius:17px;padding:26px;max-width:600px;width:calc(100% - 30px);max-height:90vh;overflow:auto;color:inherit;box-shadow:0 20px 100px #1235}dialog::backdrop{background:#102b4390}textarea{min-height:80px}#status{font-size:13px;color:#60758a;min-height:20px}.file-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;gap:8px}.file-row span{overflow-wrap:anywhere}footer{text-align:center;color:#60758a;font-size:12px;padding:24px}[hidden]{display:none!important}@media(max-width:600px){.shell{padding:16px}.gate{padding:24px;margin:20px auto}.card{padding:16px}h1{font-size:23px}td,th{padding:11px 7px}header>.row{display:grid;grid-template-columns:repeat(3,1fr);width:100%}header>.row button{padding:10px 8px;font-size:13px}.transactions-table thead{display:none}.transactions-table tr{display:block;border-bottom:1px solid #e9eef3;padding:14px 0}.transactions-table tr:last-child{border-bottom:0}.transactions-table td{display:block;border:0;padding:5px 0}.transactions-table td:first-child{font-size:16px}.transactions-table td:nth-child(3){font-size:18px;font-weight:700;color:#176a65}.transactions-table td:nth-child(4)::before{content:'Người nhập: ';color:#60758a}.transactions-table td:last-child{padding-top:10px}}
.reminder{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-left:5px solid #2b8a66;background:#f7fbfa;color:#142b43}.reminder.warning{border-left-color:#d97706;background:#fff8eb}.reminder.expired{border-left-color:#b42318;background:#fff0ef}.reminder strong,.reminder span,.reminder small{display:block}.reminder span{margin:5px 0;font-weight:700}.reminder-groups{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
</style></head><body>
<div class="shell">
<section id="gate" class="gate"><div class="brand"><div class="logo">▤</div><div><strong>Sổ Xe Tổ Chức</strong><br><small>Quản lý xe và chi phí dùng chung</small></div></div><div id="gateContent"></div><div id="gateError" class="error" hidden role="alert"></div></section>
<main id="app" hidden><header class="row spread"><div><small id="identity"></small><h1 id="orgName"></h1></div><div class="row"><button class="secondary" id="reload">Tải lại</button><button class="secondary" id="passwordButton">Đổi mật khẩu</button><button class="secondary" id="logout">Đăng xuất</button></div></header><div id="status" role="status"></div><nav id="nav"></nav><section id="content"></section></main>
<footer>Phiên bản 2.3.0 · Dữ liệu được lưu trong Google Sheet riêng của tổ chức.</footer></div>
<dialog id="modal"><form id="modalForm"><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalError" class="error" hidden role="alert"></div><div class="actions"><button id="modalSubmit" type="submit">Lưu</button><button class="secondary" type="button" id="closeModal">Đóng</button></div></form></dialog>
<script>
'use strict';
let sessionToken='',state=null,tab='overview',modalHandler=null,files=[];
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('vi-VN')+' ₫',roles={admin:'Admin',viewer:'Admin · chỉ xem',driver:'Người quản lý/lái xe'},categories={fuel:'Đổ xăng',charge:'Sạc xe',battery_rental:'Thuê pin',maintenance:'Bảo dưỡng',parts:'Phụ tùng',insurance:'Bảo hiểm TNDS',inspection:'Đăng kiểm',road_fee:'Phí đường bộ',other:'Chi phí khác'};
const admin=()=>state?.me.role==='admin',write=()=>state?.me.role!=='viewer',name=id=>state.users.find(u=>u.id===id)?.name||'—',plate=id=>state.carChoices.find(c=>c.id===id)?.plate||'—',today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function rpc(method,payload){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||'Không thể kết nối dịch vụ.')))[method](payload));}
function errorAt(selector,e){const box=$(selector);box.textContent=e.message||String(e);box.hidden=false;}
async function busy(button,fn,errorSelector='#gateError'){button.disabled=true;try{await fn();}catch(e){errorAt(errorSelector,e);}finally{button.disabled=false;}}
async function call(action,args={}){const r=await rpc('api',{token:sessionToken,action,args});if(r.token)sessionToken=r.token;if(r.data){state=r.data;render();}$('#status').textContent='Đã đồng bộ Google Sheet · '+new Date().toLocaleTimeString('vi-VN');return r;}
function accept(r){sessionToken=r.token;state=r.data;if(state.me.mustChange){passwordGate();return;}$('#gate').hidden=true;$('#gateContent').innerHTML='';$('#app').hidden=false;render();}
function gate(html){$('#app').hidden=true;$('#gate').hidden=false;$('#gateContent').innerHTML=html;$('#gateError').hidden=true;}
async function start(){try{const h=await rpc('health');if(!h.ready){gate('<h2>Dịch vụ chưa được khởi tạo</h2><p>Chủ Google Sheet cần chạy bước khởi tạo trong Google Apps Script trước.</p>');return;}if(h.deleted){gate('<h2>Tổ chức đã được xóa</h2><p>Liên hệ người quản trị để thiết lập dịch vụ mới.</p>');return;}if(h.initialized)loginGate();else initialGate();}catch(e){gate('<h2>Không kết nối được dịch vụ</h2><p>Hãy tải lại trang.</p>');errorAt('#gateError',e);}}
function initialGate(){gate('<div class="steps">Đăng nhập Admin lần đầu</div><h2>Tự động thiết lập tổ chức</h2><p class="muted">Nhập tài khoản Admin. Ứng dụng sẽ tự tạo Google Sheet riêng, thư mục tệp đính kèm và toàn bộ cấu hình cần thiết.</p><form id="initial"><label>Tên đăng nhập</label><input id="initialUsername" value="admin" required autocomplete="username" maxlength="40"><label>Mật khẩu</label><input id="initialPassword" type="password" required autocomplete="current-password" maxlength="128" autofocus><button class="wide">Đăng nhập và tự động thiết lập</button></form><div class="notice">NSD sau này chỉ cần tên đăng nhập và mật khẩu do Admin cấp, không cần đăng nhập Google.</div>');$('#initial').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{const password=$('#initialPassword').value;$('#initialPassword').value='';const r=await rpc('bootstrap',{username:$('#initialUsername').value,password});accept(r);});};}
function loginGate(){gate('<h2>Đăng nhập</h2><p class="muted">Chỉ nhập tài khoản và mật khẩu do Admin cấp. Không cần tài khoản Google, không cần file đăng nhập.</p><form id="login"><label>Tên đăng nhập</label><input id="username" required autocomplete="username" maxlength="40" autofocus><label>Mật khẩu</label><input id="password" required type="password" autocomplete="current-password" maxlength="128"><button class="wide">Đăng nhập</button></form><div class="notice">Dữ liệu được backend tự đọc từ Google Sheet riêng tư của tổ chức.</div>');$('#login').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{const password=$('#password').value;$('#password').value='';const r=await rpc('login',{username:$('#username').value,password});accept(r);});};}
function passwordGate(){gate('<h2>Đổi mật khẩu lần đầu</h2><p class="muted">Xin chào '+esc(state.me.name)+'. Hãy thay mật khẩu mặc định để tiếp tục.</p><form id="firstPassword"><label>Mật khẩu hiện tại</label><input id="current" type="password" required autocomplete="off"><label>Mật khẩu mới</label><input id="new" type="password" minlength="8" maxlength="128" required autocomplete="new-password"><label>Nhập lại mật khẩu mới</label><input id="confirm" type="password" required autocomplete="new-password"><button class="wide">Đổi mật khẩu và vào ứng dụng</button></form>');$('#firstPassword').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{if($('#new').value!==$('#confirm').value)throw new Error('Mật khẩu nhập lại không khớp.');const r=await rpc('api',{token:sessionToken,action:'changePassword',args:{currentPassword:$('#current').value,password:$('#new').value}});accept(r);});};}
function render(){if(!state||state.me.mustChange)return;$('#orgName').textContent=state.organization.name;$('#identity').textContent=state.me.name+' · '+roles[state.me.role];const tabs=[['overview','Tổng quan'],['cars','Xe'],['transactions','Giao dịch']];if(admin())tabs.push(['members','Người sử dụng'],['settings','Tổ chức']);if(!tabs.some(x=>x[0]===tab))tab='overview';$('#nav').innerHTML=tabs.map(([id,label])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'">'+label+'</button>').join('');({overview:renderOverview,cars:renderCars,transactions:renderTransactions,members:renderMembers,settings:renderSettings}[tab])();}
function dateVN(value){if(!value)return '—';const p=String(value).split('-');return p.length===3?p.reverse().join('/'):value;}
function addMonths(value,months){const p=String(value).split('-').map(Number),d=new Date(Date.UTC(p[0],p[1]-1+Number(months),p[2]));return d.toISOString().slice(0,10);}
function reminderItems(){const source=state.me.role==='driver'?(state.reminderTransactions||[]):state.transactions,cars=new Map(state.cars.map(c=>[c.id,c])),latest=new Map(),now=Date.parse(today()+'T00:00:00Z');for(const t of source){const recurring=['maintenance','parts'].includes(t.category)&&(t.repeatKm||t.repeatMonths),expiring=['insurance','inspection','road_fee'].includes(t.category)&&t.insuranceExpiry;if(!cars.has(t.carId)||(!recurring&&!expiring))continue;const key=t.carId+'|'+t.category+(recurring?'|'+String(t.description||'').trim().toLowerCase():'');const old=latest.get(key),rank=expiring?t.insuranceExpiry:t.date,oldRank=old?(expiring?old.insuranceExpiry:old.date):'';if(!old||rank>oldRank)latest.set(key,t);}return [...latest.values()].map(t=>{const car=cars.get(t.carId),expiring=['insurance','inspection','road_fee'].includes(t.category),dueDate=expiring?t.insuranceExpiry:(t.repeatMonths?addMonths(t.date,t.repeatMonths):''),days=dueDate?Math.round((Date.parse(dueDate+'T00:00:00Z')-now)/86400000):null,currentOdo=Math.max(Number(car.odo)||0,Number(state.reminderOdoByCar?.[car.id])||0,...source.filter(x=>x.carId===car.id).map(x=>Number(x.odo)||0)),dueOdo=!expiring&&t.repeatKm?Number(t.odo)+Number(t.repeatKm):null,leftKm=dueOdo===null?null:dueOdo-currentOdo,level=days!==null&&days<0||leftKm!==null&&leftKm<0?'expired':days!==null&&days<=45||leftKm!==null&&leftKm<=1500?'warning':'valid';return {t,car,dueDate,days,dueOdo,leftKm,level};}).sort((a,b)=>(a.days??999999)-(b.days??999999)||(a.leftKm??999999)-(b.leftKm??999999));}
function reminderOverview(){const items=reminderItems();if(!items.length)return '<div class="card"><h2>Cảnh báo đến hạn</h2><p class="muted">Chưa có bảo hiểm, đăng kiểm, phí đường bộ hoặc chu kỳ bảo dưỡng/phụ tùng cần theo dõi.</p></div>';return '<div class="card"><h2>Cảnh báo đến hạn</h2>'+items.map(r=>'<div class="reminder '+r.level+'"><strong>'+esc(r.car.plate)+' · '+esc(categories[r.t.category])+'</strong><span>'+esc(r.dueDate?'Đến hạn '+dateVN(r.dueDate):'Đến ODO '+Number(r.dueOdo).toLocaleString('vi-VN')+' km')+'</span><small>'+esc([r.days!==null?(r.days<0?'Quá '+(-r.days)+' ngày':'Còn '+r.days+' ngày'):'',r.leftKm!==null?(r.leftKm<0?'Vượt '+(-r.leftKm).toLocaleString('vi-VN')+' km':'Còn '+r.leftKm.toLocaleString('vi-VN')+' km'):'',r.t.description].filter(Boolean).join(' · '))+'</small></div>').join('')+'</div>';}
function renderOverview(){const total=state.transactions.reduce((s,t)=>s+t.amount,0);$('#content').innerHTML=reminderOverview()+'<div class="grid"><div class="card"><small>Xe trong phạm vi quản lý</small><div class="stat">'+state.cars.length+'</div></div><div class="card"><small>Giao dịch được xem</small><div class="stat">'+state.transactions.length+'</div></div><div class="card"><small>Tổng chi phí được xem</small><div class="stat">'+money(total)+'</div></div></div><div class="card"><h2>Chi phí theo loại</h2>'+Object.entries(categories).map(([k,v])=>'<div class="row spread" style="padding:12px 0;border-bottom:1px solid #eef2f5"><span>'+v+'</span><strong>'+money(state.transactions.filter(t=>t.category===k).reduce((s,t)=>s+t.amount,0))+'</strong></div>').join('')+'</div><div class="card"><h2>Giao dịch gần đây</h2>'+transactionTable(state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))+'</div>';}
function renderCars(){const cards=state.cars.map(c=>{const a=state.assignments.find(x=>x.carId===c.id&&!x.endedAt),total=state.transactions.filter(t=>t.carId===c.id).reduce((s,t)=>s+t.amount,0);return '<article class="card"><h2>'+esc(c.plate)+'</h2><p>'+esc(c.name)+'</p><p class="muted">'+Number(c.odo).toLocaleString('vi-VN')+' km · '+esc(a?name(a.userId):'Chưa phân công')+'</p><strong>'+money(total)+'</strong>'+fileList(c.attachments,'car',c.id)+(admin()?'<div class="actions"><button data-edit-car="'+c.id+'">Sửa</button><button class="secondary" data-assign-car="'+c.id+'">Phân công</button><button class="danger" data-delete-car="'+c.id+'">Xóa</button></div>':'')+'</article>';}).join('');$('#content').innerHTML='<div class="row spread" style="margin-bottom:18px"><h2>Xe</h2>'+(admin()?'<button id="addCar">Thêm xe</button>':'')+'</div><div class="grid">'+(cards||'<div class="empty">Chưa có xe trong phạm vi quản lý.</div>')+'</div>';$('#addCar')?.addEventListener('click',()=>editCar());}
function expenseDetails(t){let details;if(['insurance','inspection','road_fee'].includes(t.category))details=[t.description,t.insuranceProvider,t.insurancePolicy?'Số: '+t.insurancePolicy:'',t.insuranceExpiry?'Hạn: '+dateVN(t.insuranceExpiry):''];else if(['maintenance','parts'].includes(t.category))details=[t.description,t.repeatKm?'Chu kỳ '+Number(t.repeatKm).toLocaleString('vi-VN')+' km':'',t.repeatMonths?'Chu kỳ '+t.repeatMonths+' tháng':''];else if(t.category==='charge')details=[t.description,'Pin '+t.batteryFrom+'% → '+t.batteryTo+'%'];else if(t.category==='fuel')details=[t.description,t.liters?t.liters+' lít':''];else details=[t.description];return [...details,t.note].filter(Boolean).join(' · ');}
function transactionTable(list){return list.length?'<div class="table-wrap"><table class="transactions-table"><thead><tr><th>Ngày / xe</th><th>Nội dung</th><th>Chi phí</th><th>Người nhập</th><th>Thao tác</th></tr></thead><tbody>'+list.map(t=>'<tr><td>'+dateVN(t.date)+'<br><strong>'+esc(plate(t.carId))+'</strong></td><td>'+esc(categories[t.category]||t.category)+'<br><small>'+esc(expenseDetails(t))+'</small>'+fileList(t.attachments,'transaction',t.id)+'</td><td>'+money(t.amount)+'</td><td>'+esc(name(t.enteredBy))+(t.enteredBy!==t.enteredFor?'<br><small>Nhập hộ: '+esc(name(t.enteredFor))+'</small>':'')+'</td><td>'+(admin()||write()&&t.enteredBy===state.me.id?'<div class="row"><button class="secondary" data-edit-transaction="'+t.id+'">Sửa</button><button class="danger" data-delete-transaction="'+t.id+'">Xóa</button></div>':'Chỉ xem')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Chưa có giao dịch.</div>';}
function renderTransactions(){const list=state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));$('#content').innerHTML='<div class="row spread" style="margin-bottom:18px"><h2>Giao dịch</h2>'+(write()?'<button id="addTransaction">Nhập giao dịch</button>':'')+'</div><div class="card">'+transactionTable(list)+'</div>';$('#addTransaction')?.addEventListener('click',()=>editTransaction());}
function renderMembers(){$('#content').innerHTML='<div class="row spread" style="margin-bottom:18px"><h2>Người sử dụng</h2><button id="addUser">Tạo tài khoản</button></div><div class="card table-wrap"><table><thead><tr><th>Tên</th><th>Tên đăng nhập</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>'+state.users.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.username)+'</td><td>'+roles[u.role]+'</td><td>'+(u.mustChange?'Chưa đổi mật khẩu':'Đang sử dụng')+'</td><td>'+(u.id===state.me.id?'Đang đăng nhập':'<div class="row"><button class="secondary" data-reset-password="'+u.id+'">Đặt lại mật khẩu</button><button class="danger" data-delete-user="'+u.id+'">Xóa</button></div>')+'</td></tr>').join('')+'</tbody></table></div><div class="notice">Tài khoản mới hoặc vừa đặt lại có mật khẩu 11223344 và phải đổi ở lần đăng nhập tiếp theo. NSD chỉ cần tên đăng nhập và mật khẩu.</div>';$('#addUser').onclick=createUser;}
function renderSettings(){$('#content').innerHTML='<div class="card"><h2>Thông tin tổ chức</h2><label>Tên tổ chức</label><input id="rename" value="'+esc(state.organization.name)+'"><div class="actions"><button id="renameButton">Lưu tên</button></div><label>Google Sheet dữ liệu</label><input id="changeSheet" type="url" value="'+esc(state.organization.sheetUrl)+'"><p class="muted">Có thể chuyển dữ liệu sang một Google Sheet trống. Sheet cũ được giữ làm bản dự phòng; tệp đính kèm vẫn nằm trong thư mục Drive riêng của dịch vụ.</p><button id="sheetButton">Chuyển Google Sheet</button></div><div class="card"><h2>Sao lưu</h2><p class="muted">Tải bản sao mã hóa gồm toàn bộ dữ liệu và tệp đính kèm. Bản sao cần khóa của dịch vụ để khôi phục.</p><button id="exportButton">Tải bản sao mã hóa</button></div><div class="card"><h2>Xóa tổ chức</h2><p>Xóa Google Sheet dữ liệu và thư mục tệp đính kèm riêng của tổ chức.</p><button class="danger" id="deleteOrg">Xóa tổ chức</button></div>';$('#renameButton').onclick=()=>run(()=>call('renameOrganization',{name:$('#rename').value}));$('#sheetButton').onclick=()=>{if(confirm('Chuyển toàn bộ dữ liệu sang Google Sheet mới?'))run(()=>call('changeSpreadsheet',{sheetUrl:$('#changeSheet').value}));};$('#exportButton').onclick=()=>run(async()=>{const r=await call('export');download(r.backup,'so-xe-backup-'+today()+'.enc.json','application/json');});$('#deleteOrg').onclick=()=>openModal('Xóa tổ chức','<p>Nhập đúng tên tổ chức và mật khẩu Admin để xác nhận xóa tất cả dữ liệu.</p><label>Tên tổ chức</label><input name="confirmation" required><label>Mật khẩu Admin</label><input name="password" type="password" required>',async f=>{const r=await call('deleteOrganization',{confirmation:f.get('confirmation'),password:f.get('password')});if(r.deleted){sessionToken='';state=null;$('#modal').close();await start();}});}
function options(list,selected){return list.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===selected?'selected':'')+'>'+esc(x.label)+'</option>').join('');}
function fileList(list,kind,id){return (list||[]).map(f=>'<div class="file-row"><small>'+esc(f.name)+'</small><button class="secondary" data-file="'+esc(f.id)+'" data-kind="'+kind+'" data-record="'+id+'">Tải</button></div>').join('');}
function openModal(title,html,handler,existingFiles=[]){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalError').hidden=true;modalHandler=handler;files=existingFiles.map(f=>({...f}));$('#modalSubmit').textContent=title.startsWith('Xóa')?'Xác nhận xóa':'Lưu';$('#modal').showModal();if($('#fileInput')){$('#fileInput').onchange=async e=>{try{const additions=[];for(const f of e.target.files){if(f.size>2*1024*1024)throw new Error('Mỗi tệp tối đa 2 MB.');const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f);});additions.push({name:f.name,type:f.type,base64});}if(files.length+additions.length>5)throw new Error('Tối đa 5 tệp.');files.push(...additions);renderEditFiles();}catch(err){errorAt('#modalError',err);}finally{e.target.value='';}};renderEditFiles();}}
function renderEditFiles(){$('#editFiles').innerHTML=files.map((f,i)=>'<div class="file-row"><span>'+esc(f.name)+'</span><button class="danger" type="button" data-remove-file="'+i+'">Xóa</button></div>').join('');$('#editFiles').onclick=e=>{const b=e.target.closest('[data-remove-file]');if(b){files.splice(Number(b.dataset.removeFile),1);renderEditFiles();}};}
const fileEditor='<label>Tệp đính kèm</label><input id="fileInput" type="file" multiple><small>Tối đa 5 tệp, mỗi tệp 2 MB. Tệp nằm trong thư mục Drive riêng tư của dịch vụ; chỉ metadata nằm trong Sheet.</small><div id="editFiles"></div>';
function editCar(id){const c=state.cars.find(x=>x.id===id)||{};openModal(id?'Sửa xe':'Thêm xe','<label>Biển số</label><input name="plate" required maxlength="30" value="'+esc(c.plate)+'"><label>Tên xe</label><input name="name" required maxlength="100" value="'+esc(c.name)+'"><div class="grid"><div><label>Năm sản xuất</label><input name="year" pattern="[0-9]{4}" value="'+esc(c.year)+'"></div><div><label>Loại động cơ</label><select name="powerType">'+options([{id:'fuel',label:'Xăng / Dầu'},{id:'electric',label:'Điện'},{id:'hybrid',label:'Điện – Xăng'}],c.powerType||'fuel')+'</select></div><div><label>ODO hiện tại (km)</label><input name="odo" type="number" min="0" max="10000000" value="'+(c.odo||0)+'"></div></div>'+fileEditor,async f=>call('saveCar',{id:c.id,version:c.version,plate:f.get('plate'),name:f.get('name'),year:f.get('year'),powerType:f.get('powerType'),odo:Number(f.get('odo')),attachments:files}),c.attachments||[]);}
function expenseTypeFields(){const category=$('#modalBody [name=category]').value;for(const group of $('#modalBody').querySelectorAll('[data-categories]'))group.hidden=!group.dataset.categories.split(' ').includes(category);}
function editTransaction(id){const t=state.transactions.find(x=>x.id===id)||{};if(!state.carChoices.length)return alert('Admin cần nhập xe trước.');openModal(id?'Sửa chi phí':'Nhập chi phí','<label>Xe</label><select name="carId" required>'+options(state.carChoices.map(c=>({id:c.id,label:c.plate+' · '+c.name})),t.carId)+'</select><div class="grid"><div><label>Ngày giao dịch</label><input name="date" type="date" required value="'+(t.date||today())+'"></div><div><label>Loại chi phí</label><select name="category">'+options(Object.entries(categories).map(([id,label])=>({id,label})),t.category)+'</select></div></div><label>Nội dung chi phí</label><input name="description" maxlength="1000" value="'+esc(t.description)+'"><div class="grid"><div><label>Số tiền (đồng)</label><input name="amount" type="number" min="0" max="1000000000000" required value="'+(t.amount||0)+'"></div><div><label>ODO (km)</label><input name="odo" type="number" min="0" max="10000000" required value="'+(t.odo||0)+'"></div></div><div data-categories="fuel" class="grid"><div><label>Đơn giá xăng (đồng/lít)</label><input name="fuelPrice" type="number" min="0" step="0.01" value="'+(t.fuelPrice||0)+'"></div><div><label>Số lít</label><input name="liters" type="number" min="0" step="0.001" value="'+(t.liters||0)+'"></div></div><div data-categories="charge" class="grid"><div><label>Pin trước sạc (%)</label><input name="batteryFrom" type="number" min="0" max="100" value="'+(t.batteryFrom||0)+'"></div><div><label>Pin sau sạc (%)</label><input name="batteryTo" type="number" min="0" max="100" value="'+(t.batteryTo||0)+'"></div></div><div data-categories="maintenance parts" class="grid"><div><label>Chu kỳ tiếp theo (km)</label><input name="repeatKm" type="number" min="0" value="'+(t.repeatKm||0)+'"></div><div><label>Chu kỳ tiếp theo (tháng)</label><input name="repeatMonths" type="number" min="0" value="'+(t.repeatMonths||0)+'"></div></div><div data-categories="insurance inspection road_fee"><div class="grid"><div><label>Đơn vị / Nhà cung cấp</label><input name="insuranceProvider" value="'+esc(t.insuranceProvider)+'"></div><div><label>Số hợp đồng / Số chứng nhận</label><input name="insurancePolicy" value="'+esc(t.insurancePolicy)+'"></div><div><label>Ngày hiệu lực</label><input name="insuranceStart" type="date" value="'+esc(t.insuranceStart)+'"></div><div><label>Đến hạn ngày *</label><input name="insuranceExpiry" type="date" value="'+esc(t.insuranceExpiry)+'"></div></div></div><label>Nhập cho người quản lý/lái xe</label><select name="enteredFor"><option value="">Người đang được phân công xe</option>'+options(state.users.filter(u=>u.role==='driver').map(u=>({id:u.id,label:u.name})),t.enteredFor)+'</select><label>Ghi chú</label><textarea name="note" maxlength="2000">'+esc(t.note)+'</textarea>'+fileEditor,async f=>{const a=Object.fromEntries(f);for(const k of ['amount','odo','fuelPrice','liters','batteryFrom','batteryTo','repeatKm','repeatMonths'])a[k]=Number(a[k]||0);await call('saveTransaction',{...a,id:t.id,version:t.version,attachments:files});},t.attachments||[]);$('#modalBody [name=category]').onchange=expenseTypeFields;expenseTypeFields();}
function createUser(){openModal('Tạo tài khoản','<label>Họ tên</label><input name="name" required maxlength="80"><label>Tên đăng nhập</label><input name="username" required pattern="[a-zA-Z0-9_.-]{3,40}" autocomplete="off"><label>Vai trò</label><select name="role"><option value="driver">Người quản lý/lái xe</option><option value="admin">Admin</option><option value="viewer">Admin · chỉ xem</option></select><div class="notice">Mật khẩu mặc định: <strong>11223344</strong>. Gửi riêng tên đăng nhập và mật khẩu này; NSD không cần file hoặc tài khoản Google.</div>',async f=>call('createUser',{name:f.get('name'),username:f.get('username'),role:f.get('role')}));}
function assignCar(id){const drivers=state.users.filter(u=>u.role==='driver');if(!drivers.length)return alert('Hãy tạo tài khoản lái xe trước.');openModal('Phân công '+plate(id),'<label>Người quản lý/lái xe</label><select name="userId">'+'<option value="">Chưa phân công / Bỏ phân công</option>'+options(drivers.map(u=>({id:u.id,label:u.name})),state.assignments.find(a=>a.carId===id&&!a.endedAt)?.userId)+'</select>',async f=>call('assign',{carId:id,userId:f.get('userId')}));}
function download(content,filename,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
async function run(fn){$('#status').textContent='Đang xử lý…';try{await fn();}catch(e){$('#status').textContent=e.message;alert(e.message);}}
$('#modalForm').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await modalHandler(new FormData(e.target));$('#modal').close();},'#modalError');};$('#closeModal').onclick=()=>$('#modal').close();
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();}};
$('#reload').onclick=()=>run(()=>call('read'));
$('#logout').onclick=()=>{sessionToken='';state=null;$('#modal').close();$('#modalBody').innerHTML='';files=[];$('#content').innerHTML='';tab='overview';loginGate();};
$('#passwordButton').onclick=()=>openModal('Đổi mật khẩu','<label>Mật khẩu hiện tại</label><input name="current" type="password" required autocomplete="off"><label>Mật khẩu mới</label><input name="new" type="password" minlength="8" maxlength="128" required autocomplete="new-password"><label>Nhập lại mật khẩu mới</label><input name="confirm" type="password" required autocomplete="new-password">',async f=>{if(f.get('new')!==f.get('confirm'))throw new Error('Mật khẩu nhập lại không khớp.');await call('changePassword',{currentPassword:f.get('current'),password:f.get('new')});});
$('#content').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.editCar)editCar(d.editCar);if(d.assignCar)assignCar(d.assignCar);if(d.editTransaction)editTransaction(d.editTransaction);if(d.deleteTransaction){const t=state.transactions.find(x=>x.id===d.deleteTransaction);if(confirm('Xóa giao dịch và tất cả tệp đính kèm của giao dịch?'))run(()=>call('deleteTransaction',{id:t.id,version:t.version}));}if(d.deleteCar){const c=state.cars.find(x=>x.id===d.deleteCar);openModal('Xóa xe '+c.plate,'<p>Xóa xe sẽ xóa giao dịch và tệp đính kèm liên quan.</p><label>Nhập biển số để xác nhận</label><input name="confirmation" required>',async f=>call('deleteCar',{id:c.id,version:c.version,confirmation:f.get('confirmation')}));}if(d.deleteUser&&confirm('Xóa tài khoản này?'))run(()=>call('deleteUser',{id:d.deleteUser}));if(d.resetPassword&&confirm('Đặt lại mật khẩu tài khoản này về 11223344 và thu hồi phiên đăng nhập hiện tại?'))run(()=>call('resetPassword',{id:d.resetPassword}));if(d.file)run(async()=>{const r=await call('attachment',{id:d.file,transactionId:d.kind==='transaction'?d.record:undefined,carId:d.kind==='car'?d.record:undefined});const bytes=Uint8Array.from(atob(r.file.base64),c=>c.charCodeAt(0));download(bytes,r.file.name,'application/octet-stream');});};
start();
</script></body></html>
